<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spark Clicker</title>
<meta name="theme-color" content="#7c3aed">
<style>
:root{--bg-1:#241a56;--bg-2:#10233f;--bg-base:#06050c;--panel-bg:rgba(18,15,34,.82);--panel-border:rgba(255,255,255,.08);--item-bg:rgba(255,255,255,.04);--item-border:rgba(255,255,255,.07);--accent:#7c3aed;--accent-light:#c4b5fd;--accent-mid:#a78bfa;--accent-dark:#3b0764;--accent-glow:rgba(139,92,246,.45);--text:#e8e6f5;--text-dim:#8f8ab5;--text-dimmer:#6f6a94;--gold:#fbbf24;--gold-light:#fde68a;--echo:#22d3ee;--echo-light:#a5f3fc;--rose:#f43f5e;--sticker-size:22px;--coin:#fde68a}
body[data-theme="ocean"]{--bg-1:#0a2540;--bg-2:#051a2e;--bg-base:#01050a;--panel-bg:rgba(10,20,35,.82);--accent:#0ea5e9;--accent-light:#7dd3fc;--accent-mid:#38bdf8;--accent-dark:#075985;--accent-glow:rgba(14,165,233,.5);--gold:#5eead4;--gold-light:#99f6e4}
body[data-theme="sunset"]{--bg-1:#4a1428;--bg-2:#3a1a0a;--bg-base:#0f0507;--panel-bg:rgba(30,15,20,.82);--accent:#f97316;--accent-light:#fdba74;--accent-mid:#fb923c;--accent-dark:#7c2d12;--accent-glow:rgba(249,115,22,.5)}
body[data-theme="forest"]{--bg-1:#143020;--bg-2:#1a3010;--bg-base:#050a05;--panel-bg:rgba(15,30,20,.82);--accent:#10b981;--accent-light:#6ee7b7;--accent-mid:#34d399;--accent-dark:#064e3b;--accent-glow:rgba(16,185,129,.5);--gold:#fbbf24;--gold-light:#fde68a}
body[data-theme="midnight"]{--bg-1:#0a1030;--bg-2:#150a2a;--bg-base:#01010a;--panel-bg:rgba(8,10,24,.88);--accent:#4f46e5;--accent-light:#a5b4fc;--accent-mid:#818cf8;--accent-dark:#1e1b4b;--accent-glow:rgba(99,102,241,.55);--gold:#a5b4fc;--gold-light:#c7d2fe}
body[data-theme="moonlight"]{--bg-1:#1a1a2e;--bg-2:#0f1520;--bg-base:#050508;--panel-bg:rgba(15,15,25,.9);--accent:#c0c0d0;--accent-light:#f0f0ff;--accent-mid:#d8d8e8;--accent-dark:#2a2a3e;--accent-glow:rgba(200,200,220,.45);--gold:#f4f4f8;--gold-light:#ffffff;--echo:#a8d8e8;--echo-light:#d8f0f8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{min-height:100vh;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:center;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:radial-gradient(circle at 15% -10%,var(--bg-1) 0%,transparent 55%),radial-gradient(circle at 90% 110%,var(--bg-2) 0%,transparent 50%),var(--bg-base);-webkit-font-smoothing:antialiased;transition:background .4s ease;overflow-x:hidden}
.hidden{display:none!important}
.game{display:grid;grid-template-columns:240px minmax(0,1fr) 260px;gap:12px;width:min(1400px,100%);height:min(900px,96vh)}
.panel{background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(12px);overflow:hidden}
.left-panel,.right-panel{display:flex;flex-direction:column;padding:12px;gap:10px;overflow-y:auto}
.left-panel::-webkit-scrollbar,.right-panel::-webkit-scrollbar{width:4px}
.left-panel::-webkit-scrollbar-thumb,.right-panel::-webkit-scrollbar-thumb{background:var(--accent-glow);border-radius:4px}
.panel-section{background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.panel-title{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dimmer);margin:0;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.05)}
.garden{position:relative;height:170px;background:linear-gradient(180deg,rgba(139,92,246,.08) 0%,rgba(139,92,246,.02) 50%,rgba(74,222,128,.08) 100%);border-radius:10px;overflow:hidden;border:1px solid rgba(74,222,128,.15)}
.garden::after{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(180deg,rgba(74,222,128,.15),rgba(34,197,94,.25));pointer-events:none;z-index:1}
.pet{position:absolute;width:60px;height:60px;cursor:pointer;user-select:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));-webkit-tap-highlight-color:transparent;background:none;border:none;padding:0;z-index:3;transition:filter .15s}
.pet:hover{filter:drop-shadow(0 0 10px var(--gold))}
.pet.facing-left{transform:scaleX(-1)}
.pet.stage-2{width:70px;height:70px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)) drop-shadow(0 0 8px rgba(251,191,36,.4))}
.pet.stage-2.facing-left{transform:scaleX(-1)}
.pet.stage-3{width:80px;height:80px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5)) drop-shadow(0 0 15px rgba(251,191,36,.7))}
.pet.stage-3.facing-left{transform:scaleX(-1)}
.pet.hungry{animation:hungrySway .8s ease-in-out infinite}
@keyframes hungrySway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.pet.facing-left.hungry{animation:hungrySwayFlip .8s ease-in-out infinite}
@keyframes hungrySwayFlip{0%,100%{transform:scaleX(-1) rotate(-4deg)}50%{transform:scaleX(-1) rotate(4deg)}}
.pet-svg{width:100%;height:100%;display:block;transition:transform .1s}
.pet.walking .pet-svg{animation:petBob .35s ease-in-out infinite}
@keyframes petBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.pet.sleeping{opacity:.65}
.pet-bubble{position:absolute;font-size:14px;pointer-events:none;animation:bubbleFloat 2s ease-out forwards;z-index:5}
@keyframes bubbleFloat{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-30px) scale(1)}}
.pet-name{position:absolute;top:4px;left:4px;font-size:9px;font-weight:700;color:var(--text-dim);background:rgba(0,0,0,.5);padding:2px 6px;border-radius:6px;cursor:pointer;z-index:5;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
.pet-name:hover{color:var(--gold-light)}
.drops-layer{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.drop{position:absolute;width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:19px;border:none;background:transparent;cursor:pointer;pointer-events:auto;animation:dropSpin 2s linear infinite;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 0 8px rgba(251,191,36,.7))}
.drop:hover{filter:drop-shadow(0 0 15px var(--gold));transform:scale(1.2)}
@keyframes dropSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.pet-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);font-weight:600}
.hunger-bar{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.hunger-fill{height:100%;width:100%;background:linear-gradient(90deg,#4ade80,#22c55e);border-radius:3px;transition:width .3s,background .3s}
.hunger-fill.hungry{background:linear-gradient(90deg,#f43f5e,#dc2626)}
.pet-stage-badge{font-size:9px;font-weight:800;letter-spacing:.5px;padding:2px 6px;background:rgba(251,191,36,.15);color:var(--gold-light);border-radius:4px}
.bonus-list{display:flex;flex-direction:column;gap:4px;font-size:11px}
.bonus-row{display:flex;justify-content:space-between;color:var(--text-dim)}
.bonus-row span:last-child{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.bonus-row.positive span:last-child{color:#4ade80}
.bonus-row.negative span:last-child{color:#f43f5e}
.bonus-row.buff span:last-child{color:var(--gold-light)}
.workshop-mini{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.ws-item{padding:6px 4px;font-size:10px;background:var(--item-bg);border:1px solid var(--item-border);border-radius:8px;cursor:pointer;font-family:inherit;color:var(--text);text-align:center;transition:all .15s;-webkit-tap-highlight-color:transparent}
.ws-item:not(:disabled):hover{background:rgba(74,222,128,.15);border-color:rgba(74,222,128,.4)}
.ws-item:disabled{opacity:.4;cursor:not-allowed}
.ws-item.owned{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.4);color:#86efac}
.ws-item .ws-icon{font-size:16px;display:block}
.ws-item .ws-name{font-weight:600;font-size:9px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-item .ws-cost{color:var(--gold);font-weight:700;font-size:9px;margin-top:1px}
.ws-item.owned .ws-cost{color:#86efac}
.center-panel{display:flex;flex-direction:column;align-items:center;padding:14px 14px 12px;gap:6px;position:relative;overflow:hidden}
body.paused .center-panel::after{content:"PAUSED";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:64px;font-weight:900;color:rgba(255,255,255,.12);z-index:50;pointer-events:none;letter-spacing:8px;text-shadow:0 0 40px rgba(0,0,0,.6)}
.score-compact{display:flex;align-items:baseline;gap:5px;font-size:clamp(20px,3vw,28px);font-weight:800;letter-spacing:-1px;line-height:1;position:relative;z-index:1;flex-wrap:wrap;justify-content:center}
.score-compact #sparks{background:linear-gradient(180deg,#fff,var(--accent-mid));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.score-compact .bolt{font-size:.7em;filter:drop-shadow(0 0 10px var(--gold))}
.score-compact .per-sec{font-size:10px;color:var(--text-dim);font-weight:600;margin-left:2px}
.score-compact .coins{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--coin);font-weight:700;margin-left:6px;padding:2px 6px;background:rgba(253,230,138,.12);border:1px solid rgba(253,230,138,.3);border-radius:6px}
.prestige-mini-bar{width:100%;max-width:280px;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;position:relative;z-index:1}
.prestige-mini-bar .prestige-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:2px;transition:width .3s}
.clicker-center{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;padding:0 4px;min-height:200px;border-radius:14px;transition:background .4s}
.clicker-center.bg-stars{background-image:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 60% 70%,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 80% 20%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 40% 80%,rgba(255,255,255,.3),transparent),radial-gradient(1px 1px at 90% 60%,rgba(255,255,255,.4),transparent);background-size:100px 100px}
.clicker-center.bg-grid{background-image:linear-gradient(rgba(139,92,246,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.08) 1px,transparent 1px);background-size:30px 30px}
.clicker-center.bg-clouds{background:radial-gradient(ellipse at 20% 30%,rgba(255,255,255,.06),transparent 40%),radial-gradient(ellipse at 70% 60%,rgba(255,255,255,.05),transparent 40%),radial-gradient(ellipse at 40% 80%,rgba(255,255,255,.04),transparent 40%)}
.clicker-center.bg-gradient{background:linear-gradient(135deg,rgba(139,92,246,.1),rgba(34,211,238,.08),rgba(251,191,36,.06))}
.orb-arena{position:relative;width:100%;height:170px;display:flex;align-items:center;justify-content:center;z-index:1}
.orb-main{width:140px;height:140px;border-radius:50%;border:none;cursor:pointer;font-size:52px;display:grid;place-items:center;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;background:radial-gradient(circle at 35% 28%,var(--accent-light),var(--accent) 42%,var(--accent-dark) 100%);box-shadow:0 0 55px var(--accent-glow),inset 0 -14px 32px rgba(0,0,0,.5),inset 0 14px 26px rgba(255,255,255,.22);transition:box-shadow .25s,background .4s,transform .1s;position:relative;z-index:2}
.orb-main:hover{box-shadow:0 0 75px var(--accent-glow),0 0 120px var(--accent-glow),inset 0 -14px 32px rgba(0,0,0,.5),inset 0 14px 26px rgba(255,255,255,.28)}
.orb-main:active{transform:scale(.96)}
.orb-main:focus-visible{outline:3px solid var(--gold);outline-offset:6px}
.orb-main.pop{animation:pop .22s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.93)}100%{transform:scale(1)}}
.mini-orb{position:absolute;width:40px;height:40px;border-radius:50%;border:2px solid rgba(165,243,252,.4);cursor:pointer;font-size:16px;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,var(--accent-light),var(--accent) 42%,var(--accent-dark) 100%);box-shadow:0 0 18px var(--accent-glow);transition:transform .1s,left .3s ease-out,top .3s ease-out;z-index:3;-webkit-tap-highlight-color:transparent}
.mini-orb:hover{box-shadow:0 0 30px var(--accent-glow),0 0 50px rgba(34,211,238,.4)}
.mini-orb:active{transform:scale(.9)}
.chest{position:absolute;width:56px;height:56px;border-radius:10px;border:none;cursor:pointer;font-size:32px;display:grid;place-items:center;background:transparent;z-index:20;-webkit-tap-highlight-color:transparent;animation:chestWiggle 1.2s ease-in-out infinite;filter:drop-shadow(0 0 20px currentColor);transition:transform .1s}
@keyframes chestWiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.chest:hover{transform:scale(1.1);filter:drop-shadow(0 0 30px currentColor)}
.chest.opening{animation:chestOpen .6s ease-out forwards}
@keyframes chestOpen{0%{transform:scale(1);opacity:1}50%{transform:scale(1.5) rotate(20deg)}100%{transform:scale(0);opacity:0}}
.click-info{font-size:11px;font-weight:600;color:var(--accent-mid);position:relative;z-index:1}
.click-info strong{color:var(--text)}
.combo-wrap{width:100%;max-width:280px;display:flex;flex-direction:column;gap:3px;opacity:0;transition:opacity .25s;pointer-events:none;position:relative;z-index:1}
.combo-wrap.active{opacity:1}
.combo-label{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--gold-light)}
.combo-label #comboCount{font-size:13px}
.combo-bonus{font-size:10px;color:var(--text-dim)}
.combo-bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.combo-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:3px;transition:width .1s linear}
.combo-rank{font-size:9px;font-weight:800;letter-spacing:2px;text-align:center;color:var(--gold);height:11px;margin-top:1px}
.combo-rank[data-rank="HOT"]{color:#fb923c}
.combo-rank[data-rank="BLAZING"]{color:#f43f5e}
.combo-rank[data-rank="INFERNO"]{color:#fbbf24;text-shadow:0 0 8px rgba(251,191,36,.9)}
.ach-tracker{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:440px;min-height:16px;position:relative;z-index:1;font-size:10px}
.at-chip{padding:2px 7px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.25);border-radius:6px;color:var(--text-dim);font-weight:600;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.quick-upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:100%;max-width:440px;position:relative;z-index:1}
.quick-upg{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 3px;background:var(--item-bg);border:1px solid var(--item-border);border-radius:9px;cursor:pointer;font-size:9px;color:var(--text);transition:all .15s;font-family:inherit;text-align:center;-webkit-tap-highlight-color:transparent}
.quick-upg:not(:disabled):hover{background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.55)}
.quick-upg:not(:disabled):active{transform:scale(.97)}
.quick-upg:disabled{opacity:.42;cursor:not-allowed;filter:saturate(.4)}
.quick-upg .qu-icon{font-size:16px;line-height:1}
.quick-upg .qu-name{font-weight:600;line-height:1.1;font-size:8.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.quick-upg .qu-cost{color:var(--gold);font-weight:700;font-size:9px}
.quick-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;width:100%;max-width:440px;position:relative;z-index:1}
.action-btn{padding:7px 8px;font:inherit;font-size:10.5px;font-weight:700;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.4);border-radius:9px;color:var(--accent-light);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.action-btn:hover{background:rgba(139,92,246,.28);border-color:rgba(139,92,246,.7)}
.action-btn.buy-orb{background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.4);color:var(--echo-light)}
.action-btn.buy-orb:hover{background:rgba(34,211,238,.22)}
.action-btn.buy-all{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.4);color:#86efac}
.action-btn.buy-all:hover{background:rgba(74,222,128,.22)}
.action-btn:disabled{opacity:.4;cursor:not-allowed}
.goals-ticker{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:440px;font-size:10px;min-height:14px;position:relative;z-index:1}
.goal-chip{padding:2px 7px;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);border-radius:6px;color:var(--text-dim);font-weight:600;font-size:10px}
.daily-btn{font:inherit;font-size:11px;font-weight:700;padding:6px 14px;color:#1a1200;background:linear-gradient(180deg,var(--gold-light),var(--gold));border:none;border-radius:9px;cursor:pointer;box-shadow:0 4px 16px rgba(251,191,36,.4);animation:dailyPulse 2.4s ease-in-out infinite;position:relative;z-index:1}
@keyframes dailyPulse{0%,100%{box-shadow:0 4px 16px rgba(251,191,36,.35)}50%{box-shadow:0 4px 24px rgba(251,191,36,.7)}}
.boss-target{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;padding:10px;background:linear-gradient(135deg,rgba(244,63,94,.25),rgba(139,92,246,.2));border:2px solid var(--rose);border-radius:16px;cursor:pointer;z-index:10;display:flex;flex-direction:column;gap:6px;align-items:center;-webkit-tap-highlight-color:transparent;animation:bossIn .35s ease, bossPulse 1.2s ease-in-out infinite;box-shadow:0 0 40px rgba(244,63,94,.5),0 20px 60px rgba(0,0,0,.7)}
@keyframes bossIn{from{opacity:0;transform:translate(-50%,-50%) scale(.5)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes bossPulse{0%,100%{box-shadow:0 0 40px rgba(244,63,94,.5),0 20px 60px rgba(0,0,0,.7)}50%{box-shadow:0 0 60px rgba(244,63,94,.8),0 20px 60px rgba(0,0,0,.7)}}
.boss-target:active{transform:translate(-50%,-50%) scale(.95)}
.boss-target .boss-emoji{font-size:52px;line-height:1;filter:drop-shadow(0 0 15px rgba(244,63,94,.8));animation:bossFloat 2s ease-in-out infinite}
@keyframes bossFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.boss-target .boss-name{font-size:13px;font-weight:800;color:#fda4af;text-align:center;letter-spacing:.5px}
.boss-target .boss-hp-bar{width:100%;height:10px;background:rgba(0,0,0,.5);border-radius:5px;overflow:hidden;border:1px solid rgba(244,63,94,.5)}
.boss-target .boss-hp-fill{height:100%;background:linear-gradient(90deg,#f43f5e,#fda4af);width:100%;transition:width .15s;border-radius:5px}
.boss-target .boss-hp-text{font-size:10px;font-weight:700;color:#fda4af;font-variant-numeric:tabular-nums}
.boss-target .boss-timer{font-size:11px;font-weight:800;color:var(--gold-light);letter-spacing:1px}
.boss-target .boss-timer.danger{color:#f43f5e;animation:bossPulse 0.5s ease-in-out infinite}
.boss-target .boss-click-hint{font-size:9px;color:var(--text-dim);letter-spacing:1px;font-weight:600;text-transform:uppercase}
.undo-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:350;background:rgba(74,222,128,.15);border:2px solid rgba(74,222,128,.6);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:undoSlide .3s ease}
@keyframes undoSlide{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.undo-toast .ut-text{font-size:12px;color:#86efac;font-weight:600}
.undo-toast .ut-btn{font:inherit;font-size:12px;font-weight:700;padding:6px 14px;background:linear-gradient(180deg,#4ade80,#22c55e);border:none;border-radius:8px;color:#0a3a1a;cursor:pointer}
.undo-toast .ut-btn:hover{filter:brightness(1.1)}
.cheat-modal{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:500;animation:cheatIn .3s ease}

.game-banner .gb-icon{font-size:64px;line-height:1;filter:drop-shadow(0 0 20px var(--gb-color))}

function fmt(n){if(!isFinite(n))return '∞';if(n<0)return '-'+fmt(-n);if(n<1000){if(n===0)return '0';if(n<100)return(Math.round(n*10)/10).toString();return Math.floor(n).toString()}const tier=Math.floor(Math.log10(n)/3);if(tier>=SUFFIXES.length)return n.toExponential(2).replace('e+','e');const scaled=n/Math.pow(1000,tier);const digits=scaled<10?2:scaled<100?1:0;return scaled.toFixed(digits)+SUFFIXES[tier]}
function fmtTime(sec){sec=Math.floor(sec);const d=Math.floor(sec/86400),h=Math.floor((sec%86400)/3600);const m=Math.floor((sec%3600)/60),s=sec%60;if(d>0)return d+'d '+h+'h';if(h>0)return h+'h '+m+'m';if(m>0)return m+'m '+s+'s';return s+'s'}

function eEffect(t){let s=0;for(const u of ECHO_UPGRADES)if(u.effect===t)s+=eLevel(u.id)*u.perLevel;return s}
function sEffect(t){let s=0;for(const u of SIGIL_UPGRADES)if(u.effect===t)s+=sLevel(u.id)*u.perLevel;return s}
function challengeReward(t){let total=0;for(const ch of CHALLENGES){const c=state.challengesCompleted[ch.id]||0;if(!c)continue;if(ch.reward.type===t)total+=ch.reward.value*c}return total*(1+sEffect('challenge'))}

function totalMultipliers(){
  const ch=challengeMod();let incomeMult=1,clickMult=1;
  incomeMult*=achMultiplier();clickMult*=achMultiplier();
  incomeMult*=1+pEffect('prod');clickMult*=1+pEffect('click');
  incomeMult*=1+challengeReward('prod');clickMult*=1+challengeReward('click');
  incomeMult*=1+eEffect('prod');clickMult*=1+eEffect('click');
  incomeMult*=1+milestoneBonus('prod');clickMult*=1+milestoneBonus('click');
  incomeMult*=1+(state.traderBonuses.prod||0);clickMult*=1+(state.traderBonuses.click||0);
  incomeMult*=ch.productionMult;clickMult*=ch.clickMult;
  incomeMult*=1+petBonus();incomeMult*=1+decorBonus();
  const now=Date.now();
  if(now<state.clickBuffUntil)clickMult*=state.clickBuffMult;
  if(now<state.incomeBuffUntil)incomeMult*=state.incomeBuffMult;
  if(now<state.snakeBuffUntil)incomeMult*=2;
  if(now<state.jackpotBuffUntil)clickMult*=5;
  if(now<state.mushroomBuffUntil){incomeMult*=2;clickMult*=2}
  if(now<state.triforceBuffUntil){incomeMult*=1.5;clickMult*=1.5}
  if(surgeActive()){const sp=2*surgePower();incomeMult*=sp;clickMult*=sp}
  return{incomeMult,clickMult};
}

function sigilGain(){return Math.max(1,Math.floor(Math.sqrt(Math.max(0,state.prestigePointsEarned)/100)))}

function playTone(freq,dur,type,vol){

}

/* MUSIC */
function startMusic(){
  if(musicPlaying||!state.settings.musicEnabled||state.zenMode)return;
  if(!audioCtx||audioCtx.state!=='running')return;
  try{
    const gain=audioCtx.createGain();
    gain.gain.value=0;
    gain.connect(audioCtx.destination);
    const osc1=audioCtx.createOscillator();osc1.type='sine';osc1.frequency.value=110;
    const osc2=audioCtx.createOscillator();osc2.type='sine';osc2.frequency.value=165;
    const osc3=audioCtx.createOscillator();osc3.type='triangle';osc3.frequency.value=220;
    const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=400;filter.Q.value=2;
    const lfo=audioCtx.createOscillator();lfo.type='sine';lfo.frequency.value=0.08;
    const lfoGain=audioCtx.createGain();lfoGain.gain.value=30;
    lfo.connect(lfoGain);lfoGain.connect(filter.frequency);
    osc1.connect(filter);osc2.connect(filter);osc3.connect(filter);
    filter.connect(gain);
    osc1.start();osc2.start();osc3.start();lfo.start();
    const vol=(state.settings.musicVolume||30)/100*0.06;
    gain.gain.linearRampToValueAtTime(vol,audioCtx.currentTime+3);
    musicNodes={osc1,osc2,osc3,filter,gain,lfo,lfoGain};
    musicPlaying=true;
  }catch(e){}
}
function stopMusic(){
  if(!musicPlaying||!musicNodes||!audioCtx)return;
  try{
    const t=audioCtx.currentTime;
    musicNodes.gain.gain.cancelScheduledValues(t);
    musicNodes.gain.gain.linearRampToValueAtTime(0,t+0.8);
    const nodes=musicNodes;
    setTimeout(()=>{
      try{nodes.osc1.stop();nodes.osc2.stop();nodes.osc3.stop();nodes.lfo.stop();}catch(e){}
    },1000);
    musicPlaying=false;
    musicNodes=null;
  }catch(e){}
}
function updateMusicMood(){
  if(!musicPlaying||!musicNodes||!audioCtx)return;
  try{
    const t=audioCtx.currentTime;
    const cf=Math.min(1,state.combo/40);
    const sf=surgeActive()?1.5:1;
    const boost=1+cf*0.3*sf;
    musicNodes.osc1.frequency.linearRampToValueAtTime(110*boost,t+0.5);
    musicNodes.osc2.frequency.linearRampToValueAtTime(165*boost,t+0.5);
    musicNodes.osc3.frequency.linearRampToValueAtTime(220*boost,t+0.5);
    const filterTarget=400+cf*800*sf;
    musicNodes.filter.frequency.linearRampToValueAtTime(filterTarget,t+0.5);
    const vol=(state.settings.musicVolume||30)/100*0.06*(1+cf*0.4);
    musicNodes.gain.gain.linearRampToValueAtTime(vol,t+0.5);
  }catch(e){}
}

function pickChestRarity(){const total=CHEST_RARITIES.reduce((s,r)=>s+r.weight,0);let x=Math.random()*total;for(const r of CHEST_RARITIES){x-=r.weight;if(x<=0)return r}return CHEST_RARITIES[0]}
function trySpawnChest(now){
  if(currentChestEl)return;
  if(now<state.nextChestAt)return;
  spawnChest();
}
function spawnChest(forced){
  if(currentChestEl)return;
  const rarity=forced||pickChestRarity();
  const arena=$('orbArena');
  if(!arena)return;
  const rect=arena.getBoundingClientRect();
  const x=Math.random()*Math.max(0,rect.width-60);
  const y=Math.random()*Math.max(0,rect.height-60);
  const el=document.createElement('button');
  el.className='chest';el.type='button';
  el.textContent=rarity.icon;
  el.style.left=x+'px';el.style.top=y+'px';
  el.style.color=rarity.color;
  el.dataset.rarity=rarity.id;
  el.addEventListener('click',()=>openChest(el,rarity));
  arena.appendChild(el);
  currentChestEl=el;
  setTimeout(()=>{
    if(currentChestEl===el){
      el.remove();currentChestEl=null;
      state.nextChestAt=Date.now()+90000+Math.random()*90000;
    }
  },15000);
}
function openChest(el,rarity){
  if(el!==currentChestEl)return;
  currentChestEl=null;
  el.classList.add('opening');
  SFX.chest();
  const sparkGain=Math.floor((income()*20+clickPower()*30)*rarity.sparkMult);
  state.sparks+=sparkGain;state.totalSparks+=sparkGain;state.runSparks+=sparkGain;
  state.sparkCoins+=rarity.coins;
  state.coinsEarned+=rarity.coins;
  state.chestsOpened+=1;
  const r=el.getBoundingClientRect();
  spawnFloat(r.left+r.width/2,r.top,'+'+fmt(sparkGain),true);
  setTimeout(()=>{
    spawnFloat(r.left+r.width/2,r.top+20,'+'+rarity.coins+' 🪙',false,false,false,true);
    SFX.coin();
  },300);
  toast(rarity.name+' chest! +'+fmt(sparkGain)+' sparks, +'+rarity.coins+' coins','coin');
  setTimeout(()=>el.remove(),600);
  state.nextChestAt=Date.now()+90000+Math.random()*90000;
  save();render();
}

/* TRADER */
function trySpawnTrader(now){
  if(state.activeTrader)return;
  if(now-state.lastTraderAt<240000)return;
  if(Math.random()>0.02)return;
  spawnTrader();
}
function spawnTrader(){
  const pool=[...TRADER_POOL];
  const offers=[];
  while(offers.length<3&&pool.length>0){
    const idx=Math.floor(Math.random()*pool.length);
    offers.push(pool.splice(idx,1)[0]);
  }
  state.activeTrader={offers,expiresAt:Date.now()+90000,purchased:[]};
  state.lastTraderAt=Date.now();
  SFX.trade();
  toast('🧙 A wandering trader appears!','coin');
  openTrader();
  if(traderTimerInterval)clearInterval(traderTimerInterval);
  traderTimerInterval=setInterval(()=>{
    if(!state.activeTrader)return clearInterval(traderTimerInterval);
    if(Date.now()>state.activeTrader.expiresAt){
      state.activeTrader=null;
      clearInterval(traderTimerInterval);
      closeTrader();
    } else if(!$('traderOverlay').classList.contains('hidden')){
      updateTraderTimer();
    }
  },500);
}
function openTrader(){
  if(!state.activeTrader)return;
  renderTrader();
  $('traderOverlay').classList.remove('hidden');
}
function closeTrader(){
  $('traderOverlay').classList.add('hidden');
}
function updateTraderTimer(){
  if(!state.activeTrader)return;
  const rem=Math.max(0,Math.ceil((state.activeTrader.expiresAt-Date.now())/1000));
  const el=$('traderTitle');
  if(el)el.textContent='🧙 Wandering Trader ('+rem+'s)';
}
function renderTrader(){
  if(!state.activeTrader)return;
  updateTraderTimer();
  const body=$('traderBody');
  let html='<div style="margin-bottom:10px;font-size:12px;color:var(--text-dim);">Your coins: <strong style="color:var(--coin);">🪙 '+state.sparkCoins+'</strong></div>';
  html+='<div class="items">';
  for(let i=0;i<state.activeTrader.offers.length;i++){
    const o=state.activeTrader.offers[i];
    const purchased=state.activeTrader.purchased.includes(i);
    const canAfford=state.sparkCoins>=o.cost;
    const disabled=purchased||!canAfford;
    html+='<button class="item trader" data-trader-idx="'+i+'" '+(disabled?'disabled':'')+'>';
    html+='<span class="icon">'+o.icon+'</span>';
    html+='<span class="info"><span class="name">'+o.name+'</span><span class="effect">'+o.desc+'</span><span class="cost">'+(purchased?'SOLD':o.cost+' 🪙')+'</span></span></button>';
  }
  html+='</div>';
  html+='<div class="btn-row" style="margin-top:14px;"><button class="small-btn" id="closeTraderBtn">Close</button></div>';
  body.innerHTML=html;
  document.querySelectorAll('[data-trader-idx]').forEach(btn=>{
    btn.addEventListener('click',()=>buyTraderOffer(parseInt(btn.dataset.traderIdx,10)));
  });
  const closeBtn=$('closeTraderBtn');
  if(closeBtn)closeBtn.addEventListener('click',closeTrader);
}
function buyTraderOffer(idx){
  if(!state.activeTrader)return;
  const o=state.activeTrader.offers[idx];
  if(!o)return;
  if(state.activeTrader.purchased.includes(idx))return;
  if(state.sparkCoins<o.cost){toast('Not enough coins.','warn');return}
  state.sparkCoins-=o.cost;
  state.activeTrader.purchased.push(idx);
  state.tradesMade+=1;
  o.apply();
  SFX.trade();
  toast('✅ Purchased: '+o.name,'coin');
  save();render();renderTrader();
}

/* LOADOUTS */
function saveLoadout(idx){
  const upgrades={};
  for(const id in state.prestigeUpgrades){if(state.prestigeUpgrades[id]>0)upgrades[id]=state.prestigeUpgrades[id]}
  if(Object.keys(upgrades).length===0){toast('Buy some prestige upgrades first.','warn');return}
  state.loadouts[idx]={upgrades,savedAt:Date.now()};
  save();renderModal();
  toast('💾 Loadout '+idx+' saved!','ach');
}
function loadLoadout(idx){
  const lo=state.loadouts[idx];
  if(!lo){toast('Empty slot.','warn');return}
  let refund=0;
  for(const id in state.prestigeUpgrades){
    const lvl=state.prestigeUpgrades[id];
    const def=PRESTIGE_UPGRADES.find(d=>d.id===id);
    if(!def)continue;
    for(let i=0;i<lvl;i++)refund+=Math.ceil(def.baseCost*Math.pow(def.growth,i));
  }
  const newPoints=state.prestigePoints+refund;
  let cost=0;
  for(const id in lo.upgrades){
    const def=PRESTIGE_UPGRADES.find(d=>d.id===id);
    if(!def)continue;
    for(let i=0;i<lo.upgrades[id];i++)cost+=Math.ceil(def.baseCost*Math.pow(def.growth,i));
  }
  if(newPoints<cost){toast('Not enough PP ('+cost+' needed, '+newPoints+' available).','warn');return}
  if(!confirm('Load this loadout? Refund current tree ('+refund+' PP) and spend '+cost+' PP on the loadout.'))return;
  state.prestigePoints=newPoints-cost;
  state.prestigeUpgrades={...lo.upgrades};
  save();render();renderModal();
  toast('📂 Loadout loaded.','ach');
}
function deleteLoadout(idx){
  if(!confirm('Delete this loadout?'))return;
  state.loadouts[idx]=null;
  save();renderModal();
}

/* CHEATS */
function revealCheatModal(){const modal=$('cheatModal');modal.classList.remove('hidden');const input=$('cheatInput');input.value='';input.focus();clearTimeout(cheatModalTimer);cheatModalTimer=setTimeout(()=>{if(!modal.classList.contains('hidden'))hideCheatModal()},30000)}
function hideCheatModal(){$('cheatModal').classList.add('hidden');clearTimeout(cheatModalTimer)}
function setCheatStatus(msg,cls){const el=$('cheatStatus');el.textContent=msg;el.classList.remove('success','error','warn');if(cls)el.classList.add(cls)}
function activateCheat(code){
  const clean=code.toLowerCase().trim();
  if(!clean){setCheatStatus('Type a code','warn');return}
  if(!CHEAT_CODES[clean]){setCheatStatus('❌ Not a valid code','error');return}
  const cheat=CHEAT_CODES[clean];
  const now=Date.now();
  const lastUsed=state.codesUsed[clean]||0;
  if(cheat.cooldown&&now-lastUsed<cheat.cooldown){const rem=Math.ceil((cheat.cooldown-(now-lastUsed))/1000);setCheatStatus('⏳ Cooldown: '+rem+'s','warn');return}
  if(cheat.permanent){
    if(clean==='moonlight'&&state.hiddenUnlocked.moonlight){setCheatStatus('✅ Already unlocked','success');return}
    if(clean==='kitty'&&state.hiddenUnlocked.kitty){setCheatStatus('✅ Already unlocked','success');return}
  }
  const bossRequired=['nuke','hadouken'].includes(clean);
  if(bossRequired&&!state.activeBoss){setCheatStatus('⚠ No boss active','warn');return}
  const isFirstTime=!state.codesFound[clean];
  state.codesUsed[clean]=now;
  switch(clean){
    case 'spark':state.clickBuffUntil=now+60000;state.clickBuffMult=20;break;
    case 'goldrush':state.incomeBuffUntil=now+30000;state.incomeBuffMult=10;break;
    case 'golden':for(let i=0;i<3;i++)setTimeout(spawnGolden,i*400);break;
    case 'boss':{state.activeBoss=null;state.lastBossAt=0;const tier=Math.min(Math.floor(state.bossKills/3),BOSS_TYPES.length-1);const t=BOSS_TYPES[tier];const hp=Math.max(20,Math.floor(clickPower()*t.hpMult*5+baseIncome()*2));const reward=Math.floor(income()*t.rewardMult*6+clickPower()*t.rewardMult*2);state.activeBoss={name:t.name,icon:t.icon,maxHp:hp,hp:hp,reward:reward,spawnedAt:now,expiresAt:now+20000};showBossUI();break}
    case 'pet':state.pet.hunger=100;state.pet.fedCount+=5;renderPet();break;
    case 'daily':state.lastDailyClaim=0;break;
    case 'echo':state.prestigePoints+=1;state.prestigePointsEarned+=1;break;
    case 'moonlight':state.hiddenUnlocked.moonlight=true;break;
    case 'kitty':state.hiddenUnlocked.kitty=true;break;
    case 'zen':state.zenMode=true;stopMusic();break;
    case 'chest':spawnChest(CHEST_RARITIES[3]);break;
    case 'coins':state.sparkCoins+=50;state.coinsEarned+=50;break;
    case 'snake':state.snakeBuffUntil=now+90000;break;
    case 'iddqd':state.autoKillBosses=(state.autoKillBosses||0)+1;break;
    case 'creeper':for(let i=0;i<5;i++)setTimeout(spawnGolden,i*300);break;
    case 'herb':state.pet.hunger=100;state.pet.fedCount+=3;renderPet();break;
    case 'jackpot':state.jackpotBuffUntil=now+45000;break;
    case 'nuke':state.activeBoss.hp=0;state.activeBoss.reward*=2;killBoss();break;
    case 'hadouken':state.activeBoss.hp=Math.max(0,state.activeBoss.hp-state.activeBoss.maxHp*0.5);{const hpFill=$('bossHpFill'),hpText=$('bossHpText');if(hpFill)hpFill.style.width=Math.max(0,(state.activeBoss.hp/state.activeBoss.maxHp)*100)+'%';if(hpText)hpText.textContent=Math.max(0,state.activeBoss.hp)+' / '+state.activeBoss.maxHp+' HP';if(state.activeBoss.hp<=0)killBoss()}break;
    case 'mushroom':state.mushroomBuffUntil=now+30000;break;
    case 'wololo':state.autoKillBosses=(state.autoKillBosses||0)+2;break;
    case 'triforce':state.triforceBuffUntil=now+60000;state.prestigePoints+=1;state.prestigePointsEarned+=1;break;
  }
  if(isFirstTime)state.codesFound[clean]=true;
  setCheatStatus('✅ '+cheat.name+' activated!','success');
  if(cheat.vg&&cheat.banner){showGameBanner(cheat.icon,cheat.banner,cheat.bannerSub,cheat.bannerColor)}
  else{toast('🔓 '+cheat.name+' — '+cheat.desc,'ach')}
  SFX.cheat();save();render();
  if(isFirstTime){
    const checkAndAward=(id,name,delay)=>{if(state.achievements[id])return;setTimeout(()=>{state.achievements[id]=true;toast('🏆 '+name,'ach');SFX.ach()},delay)};
    checkAndAward('secret_first','Curious — Find your first cheat code',500);
    const totalFound=Object.keys(state.codesFound).length;
    if(totalFound>=5)checkAndAward('secret_5','Codebreaker — Find 5 cheat codes',800);
    if(totalFound>=Object.keys(CHEAT_CODES).length)checkAndAward('secret_all','Master Coder — Find every cheat code',1100);
    const vgFound=countVGCodes(state);
    if(vgFound>=1)checkAndAward('vg_first','Player One — Find a video game reference code',600);
    if(vgFound>=5)checkAndAward('vg_5','Speedrunner — Find 5 video game codes',900);
    if(vgFound>=totalVGCodes())checkAndAward('vg_all','True Gamer — Find all video game codes',1200);
  }
}

/* BOSS */
function trySpawnBoss(now){
  if(state.activeBoss)return;
  if(now-state.lastBossAt<120000)return;
  if(Math.random()>0.015)return;
  const tier=Math.min(Math.floor(state.bossKills/3),BOSS_TYPES.length-1);
  const t=BOSS_TYPES[tier];
  const hp=Math.max(20,Math.floor(clickPower()*t.hpMult*5+baseIncome()*2));
  const reward=Math.floor(income()*t.rewardMult*3+clickPower()*t.rewardMult);
  const duration=t.short?12000:20000;
  state.activeBoss={name:t.name,icon:t.icon,maxHp:hp,hp:hp,reward:reward,spawnedAt:now,expiresAt:now+duration};
  state.lastBossAt=now;
  showBossUI();
  if(state.autoKillBosses>0){state.autoKillBosses--;setTimeout(()=>{if(state.activeBoss)killBoss()},400)}
}
function showBossUI(){
  if(bossEl)bossEl.remove();
  const boss=state.activeBoss;if(!boss)return;
  bossEl=document.createElement('button');
  bossEl.className='boss-target';bossEl.type='button';
  bossEl.innerHTML='<div class="boss-emoji">'+boss.icon+'</div><div class="boss-name">'+boss.name+'</div><div class="boss-hp-bar"><div class="boss-hp-fill" id="bossHpFill"></div></div><div class="boss-hp-text" id="bossHpText">'+boss.maxHp+' / '+boss.maxHp+' HP</div><div class="boss-timer" id="bossTimer">'+((boss.expiresAt-Date.now())/1000).toFixed(1)+'s</div><div class="boss-click-hint">Click to attack</div>';
  bossEl.addEventListener('click',(e)=>{e.stopPropagation();damageBoss()});
  $('clickerCenter').appendChild(bossEl);
  if(bossTimerInterval)clearInterval(bossTimerInterval);
  bossTimerInterval=setInterval(updateBossTimer,100);
  SFX.ach();
  toast('⚔️ Boss appears: '+boss.name+'! Click to attack.','warn');
}
function updateBossTimer(){
  if(!state.activeBoss||!bossEl)return;
  const rem=Math.max(0,(state.activeBoss.expiresAt-Date.now())/1000);
  const timerEl=$('bossTimer');
  if(timerEl){timerEl.textContent=rem.toFixed(1)+'s';timerEl.classList.toggle('danger',rem<5)}
  if(rem<=0&&state.activeBoss){
    const name=state.activeBoss.name;
    state.activeBoss=null;
    clearInterval(bossTimerInterval);bossTimerInterval=null;
    if(bossEl){bossEl.remove();bossEl=null}
    toast('💨 '+name+' escaped!','warn');
  }
}
function damageBoss(){
  if(!state.activeBoss)return;
  const isCrit=Math.random()<0.05;
  const dmg=clickPower()*(isCrit?10:1);
  state.activeBoss.hp-=dmg;
  SFX.bossHit();
  if(isCrit){SFX.crit();const r=bossEl.getBoundingClientRect();spawnFloat(r.left+r.width/2,r.top+r.height/2,'CRIT! '+fmt(dmg),false,false,true)}
  const hpFill=$('bossHpFill'),hpText=$('bossHpText');
  if(hpFill)hpFill.style.width=Math.max(0,(state.activeBoss.hp/state.activeBoss.maxHp)*100)+'%';
  if(hpText)hpText.textContent=Math.max(0,state.activeBoss.hp)+' / '+state.activeBoss.maxHp+' HP';
  if(state.activeBoss.hp<=0)killBoss();
}
function killBoss(){
  const boss=state.activeBoss;if(!boss)return;
  state.sparks+=boss.reward;state.totalSparks+=boss.reward;state.runSparks+=boss.reward;
  state.bossKills+=1;
  const coins=1+Math.floor(Math.random()*3);
  state.sparkCoins+=coins;state.coinsEarned+=coins;
  state.activeBoss=null;
  clearInterval(bossTimerInterval);bossTimerInterval=null;
  if(bossEl){bossEl.remove();bossEl=null}
  SFX.bossDie();
  spawnFloat(window.innerWidth/2,window.innerHeight/2,'+'+fmt(boss.reward),true);
  toast('⚔️ '+boss.name+' defeated! +'+fmt(boss.reward)+' sparks, +'+coins+' 🪙','ach');
  save();
}

function renderPet(){const petType=allPets().find(p=>p.id===state.settings.pet)||PET_TYPES[0];petEl.innerHTML=petType.svg;petEl.classList.remove('stage-1','stage-2','stage-3');petEl.classList.add('stage-'+petStage())}
function renderPetName(){const el=$('petName');el.textContent=state.petName||'Pet'}
function initPet(){

  renderPet();renderPetName();
  $('petName').addEventListener('click',(e)=>{e.stopPropagation();const name=prompt('Name your pet:',state.petName||'Pet');if(name!==null){state.petName=name.trim().slice(0,20)||'Pet';renderPetName();save()}});

  state.pet.nextSpeechAt=Date.now()+5000+Math.random()*10000;

}
function feedPet(){
  if(Date.now()<state.pet.feedCooldownUntil)return;
  if(state.pet.hunger>=95){showPetBubble('😊');return}
  const oldStage=petStage();
  state.pet.hunger=Math.min(100,state.pet.hunger+30);
  state.pet.feedCooldownUntil=Date.now()+1500;
  state.pet.fedCount+=1;
  state.lastActivity=Date.now();state.pet.sleeping=false;state.pet.idleUntil=Date.now()+800;
  showPetBubble('❤️');spawnHeartBurst();SFX.ach();
  const newStage=petStage();
  if(newStage>oldStage){renderPet();toast('🌟 Your pet evolved to stage '+newStage+'! Bonus increased.','ach');SFX.prestige()}
  save();
}
function showPetBubble(text){if(!petEl)return;const bubble=document.createElement('div');bubble.className='pet-bubble';bubble.textContent=text;const garden=$('garden');const r=petEl.getBoundingClientRect();const parentR=garden.getBoundingClientRect();bubble.style.left=(r.left-parentR.left+10)+'px';bubble.style.top=(r.top-parentR.top-10)+'px';garden.appendChild(bubble);setTimeout(()=>bubble.remove(),2100)}
function spawnHeartBurst(){if(!petEl)return;const r=petEl.getBoundingClientRect();for(let i=0;i<3;i++){setTimeout(()=>{const h=document.createElement('div');h.className='pet-bubble';h.textContent='❤️';h.style.left=(r.left-40+Math.random()*40)+'px';h.style.top=(r.top+Math.random()*20)+'px';h.style.position='fixed';document.body.appendChild(h);setTimeout(()=>h.remove(),2100)},i*150)}}
function tickPet(dt,now){
  const pet=state.pet;if(!petEl)return;
  pet.hunger=Math.max(0,pet.hunger-dt*0.12);
  const garden=$('garden');const gw=garden.clientWidth,gh=garden.clientHeight;
  if(pet.idleUntil&&now<pet.idleUntil){petEl.style.left=pet.x+'px';petEl.style.top=pet.y+'px';return}
  if(now>pet.nextIdleAt){
    if(Math.random()<0.5){pet.idleUntil=now+1500+Math.random()*2000;pet.nextIdleAt=now+10000+Math.random()*20000;if(pet.hunger<30&&!pet.sleeping){pet.sleeping=true;petEl.classList.add('sleeping')}else{pet.sleeping=false;petEl.classList.remove('sleeping')}}
    else pet.nextIdleAt=now+8000+Math.random()*15000;
  }
  const speed=pet.hunger<25?0.3:pet.hunger<50?0.6:1.0;
  pet.x+=pet.dir*speed*dt*60;
  const pw=petEl.offsetWidth||60;
  if(pet.x<4){pet.x=4;pet.dir=1}
  if(pet.x>gw-pw-4){pet.x=gw-pw-4;pet.dir=-1}
  pet.y=gh-pw-10+Math.sin(now/400)*2;
  petEl.style.left=pet.x+'px';petEl.style.top=pet.y+'px';
  petEl.classList.toggle('facing-left',pet.dir<0);
  petEl.classList.toggle('hungry',pet.hunger<25&&!pet.sleeping);
  petEl.classList.toggle('walking',!pet.sleeping&&!(pet.idleUntil&&now<pet.idleUntil));
  if(now>pet.nextDropAt&&pet.hunger>=50){spawnDrop(pet.x+20,pet.y+10);pet.nextDropAt=now+45000+Math.random()*45000;showPetBubble('🎁')}
  if(now>pet.nextSpeechAt){if(pet.hunger<25)showPetBubble('🍽️');else if(Math.random()<0.4)showPetBubble(['❤️','✨','😊'][Math.floor(Math.random()*3)]);pet.nextSpeechAt=now+25000+Math.random()*25000}
}

/* DROPS */
function pickDropType(){const total=DROP_TYPES.reduce((s,d)=>s+d.weight,0);let r=Math.random()*total;for(const d of DROP_TYPES){r-=d.weight;if(r<=0)return d}return DROP_TYPES[0]}
function spawnDrop(x,y){const type=pickDropType();const el=document.createElement('button');el.className='drop';el.type='button';el.textContent=type.icon;el.style.left=x+'px';el.style.top=y+'px';const drop={el,x,y,vy:40+Math.random()*30,type,caught:false};el.addEventListener('click',()=>collectDrop(drop));$('dropsLayer').appendChild(el);activeDrops.push(drop)}
function collectDrop(drop){if(drop.caught)return;drop.caught=true;const gain=Math.floor(drop.type.reward(state));state.sparks+=gain;state.totalSparks+=gain;state.runSparks+=gain;state.dropsCaught+=1;spawnFloat(parseFloat(drop.el.style.left)+20,parseFloat(drop.el.style.top)+20,'+'+fmt(gain),true);SFX.drop();drop.el.remove();const i=activeDrops.indexOf(drop);if(i>=0)activeDrops.splice(i,1);save()}
function tickDrops(dt){const gh=$('garden').clientHeight;for(let i=activeDrops.length-1;i>=0;i--){const d=activeDrops[i];if(d.caught)continue;d.y+=d.vy*dt;d.vy+=60*dt;if(d.y>gh-30){d.el.remove();activeDrops.splice(i,1)}else d.el.style.top=d.y+'px'}}

const QUEST_TYPES=[
  {id:'click',gen:()=>({goal:20+Math.floor(Math.random()*30),scale:2}),test:(s,q)=>s.clicks-q.startValue>=q.goal},
  {id:'buy',gen:()=>({goal:3+Math.floor(Math.random()*5),scale:3}),test:(s,q)=>countBuyable()-q.startValue>=q.goal},
  {id:'drops',gen:()=>({goal:2+Math.floor(Math.random()*3),scale:5}),test:(s,q)=>s.dropsCaught-q.startValue>=q.goal},
  {id:'feed',gen:()=>({goal:2+Math.floor(Math.random()*3),scale:4}),test:(s,q)=>s.pet.fedCount-q.startValue>=q.goal},
  {id:'events',gen:()=>({goal:1+Math.floor(Math.random()*2),scale:8}),test:(s,q)=>s.eventsCaught-q.startValue>=q.goal},

];
function countBuyable(){let c=0;for(const k in state.clickUpgrades)c+=state.clickUpgrades[k];for(const k in state.buildings)c+=state.buildings[k];return c}
function generateQuest(){const type=QUEST_TYPES[Math.floor(Math.random()*QUEST_TYPES.length)];const g=type.gen();return{id:type.id,goal:g.goal,scale:g.scale,startValue:type.id==='click'?state.clicks:type.id==='buy'?countBuyable():type.id==='drops'?state.dropsCaught:type.id==='feed'?state.pet.fedCount:type.id==='events'?state.eventsCaught:type.id==='boss'?state.bossKills:state.chestsOpened,complete:false}}
function checkQuests(){let changed=false;for(const q of state.quests){if(q.complete)continue;const type=QUEST_TYPES.find(t=>t.id===q.id);if(!type)continue;if(type.test(state,q)){q.complete=true;const reward=Math.max(500,income()*q.scale);state.sparks+=reward;state.totalSparks+=reward;state.runSparks+=reward;state.questsCompleted+=1;setTimeout(()=>{toast('📋 Quest complete: +'+fmt(reward),'ach');SFX.ach()},pendingAchToasts*400);changed=true}}if(changed){setTimeout(()=>{state.quests=state.quests.filter(q=>!q.complete);while(state.quests.length<3)state.quests.push(generateQuest());renderQuests()},1500)}}

/* BUY */
function totalCostFor(def,count,qty){let t=0;for(let i=0;i<qty;i++)t+=costOf(def,count+i);return t}
function maxAffordable(def,count){let t=0,q=0;while(q<10000){const c=costOf(def,count+q);if(t+c>state.sparks)break;t+=c;q++}return q}
function buy(def,isClick){state.lastActivity=Date.now();lastActiveClick=Date.now();const mod=challengeMod();if(isClick&&mod.noClickUpgrades){toast('Click upgrades are disabled in this challenge.');return}if(!isClick&&mod.noGenerators){toast('Generators are disabled in this challenge.');return}const store=isClick?state.clickUpgrades:state.buildings;const count=store[def.id]||0;let qty;if(buyQty==='max'){qty=maxAffordable(def,count);if(qty===0)return}else qty=buyQty;const cost=totalCostFor(def,count,qty);if(state.sparks<cost)return;state.sparks-=cost;store[def.id]=count+qty;if(isClick)state.clickUpgradesBought+=qty;SFX.buy();save()}
function buyAllAffordable(){let bought=0;for(const def of CLICK_UPGRADES){const count=state.clickUpgrades[def.id]||0;const cost=costOf(def,count);if(state.sparks>=cost){state.sparks-=cost;state.clickUpgrades[def.id]=count+1;state.clickUpgradesBought+=1;bought++}}for(const def of BUILDINGS){const count=state.buildings[def.id]||0;const cost=costOf(def,count);if(state.sparks>=cost){state.sparks-=cost;state.buildings[def.id]=count+1;bought++}}if(bought>0){SFX.buy();toast('🛒 Bought '+bought+' upgrade'+(bought===1?'':'s')+'!','ach');save()}else toast('Nothing affordable right now.','warn')}
function buyDecor(item){if(state.decor[item.id])return;if(state.sparks<item.cost)return;state.sparks-=item.cost;state.decor[item.id]=true;SFX.buy();toast('🪴 Added: '+item.name);save()}
function buyPrestige(def){const lvl=pLevel(def.id);if(lvl>=def.maxLevel)return;if(!canUnlockPrestige(def)){toast('🔒 '+describeRequires(def));return}const cost=prestigeCostOf(def);if(state.prestigePoints<cost)return;state.prestigePoints-=cost;state.prestigeUpgrades[def.id]=lvl+1;SFX.buy();save();renderModal()}
function buyEcho(def){const lvl=eLevel(def.id);if(lvl>=def.maxLevel)return;const cost=echoCostOf(def);if(state.echoes<cost)return;state.echoes-=cost;state.echoUpgrades[def.id]=lvl+1;SFX.buy();save();renderModal()}
function buySigil(def){const lvl=sLevel(def.id);if(lvl>=def.maxLevel)return;const cost=sigilCostOf(def);if(state.sigils<cost)return;state.sigils-=cost;state.sigilUpgrades[def.id]=lvl+1;SFX.buy();save();renderModal()}

function doClick(x,y){
  state.lastClickAt=Date.now();state.lastActivity=Date.now();lastActiveClick=Date.now();
  state.combo=Math.min(comboCap(),state.combo+comboPerClick());
  if(state.combo>state.maxCombo)state.maxCombo=state.combo;
  if(state.activeChallenge&&state.combo>(state.activeChallenge.maxCombo||0))state.activeChallenge.maxCombo=state.combo;
  const gain=clickPower();state.sparks+=gain;state.totalSparks+=gain;state.runSparks+=gain;state.clicks+=1;
  spawnFloat(x,y,'+'+fmt(gain));SFX.click();
  if(Math.random()<0.6)spawnClickParticle(x,y);

function renderChallengesModal(){let html='';if(state.activeChallenge){const ac=state.activeChallenge;let cur=ac.goalType==='runSparks'?state.runSparks:ac.goalType==='maxCombo'?(ac.maxCombo||0):0;const pct=Math.min(100,(cur/ac.goal)*100);const label=ac.goalType==='maxCombo'?Math.floor(cur)+' / '+Math.ceil(ac.goal)+'x':fmt(cur)+' / '+fmt(ac.goal);html+='<div class="active-challenge"><div class="ch-head"><span class="ch-icon">'+ac.icon+'</span><div class="ch-info"><div class="ch-name">'+ac.name+'</div><div class="ch-desc">'+ac.desc+'</div></div></div><div style="font-size:12px;font-weight:600;">'+label+' ('+pct.toFixed(0)+'%)</div><div style="height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,var(--gold),var(--gold-light));"></div></div><button class="small-btn danger" id="abandonBtn">Abandon</button></div>';return html}html+='<h2>Challenges</h2><p class="tab-sub">Each challenge is repeatable — every repeat doubles the goal and stacks the reward.</p>';for(const ch of CHALLENGES){const count=state.challengesCompleted[ch.id]||0;const goal=ch.goal*Math.pow(2,count);const goalText=ch.goalType==='maxCombo'?Math.ceil(goal)+'x':fmt(goal);html+='<div class="challenge-card '+ch.tier+(count>0?' completed':'')+'"><div class="ch-head"><span class="ch-icon">'+ch.icon+'</span><div class="ch-info"><div class="ch-name">'+ch.name+(count>0?' <span class="ch-level">×'+count+'</span>':'')+'</div><div class="ch-desc">'+ch.desc.replace('{goal}',goalText)+'</div><div class="ch-reward">Next reward: '+ch.reward.label+'</div></div><div class="ch-tier">'+ch.tier+'</div></div><button class="small-btn ch-start" data-challenge="'+ch.id+'">'+(count>0?'Repeat':'Start')+'</button></div>'}return html}

</h2>';for(const [l,v] of rows)html+='<div class="stat-row"><span class="stat-label">'+l+'</span><span class="stat-value">'+v+'</span></div>';return html}

function attachModalListeners(title){
  if(title==='Shop'){document.querySelectorAll('[data-qty]').forEach(btn=>{btn.addEventListener('click',()=>{const q=btn.dataset.qty;buyQty=q==='max'?'max':parseInt(q,10);renderModal()})});document.querySelectorAll('.shop-item').forEach(btn=>{btn.addEventListener('click',()=>{const id=btn.dataset.shop,isClick=btn.dataset.click==='1';const def=(isClick?CLICK_UPGRADES:BUILDINGS).find(d=>d.id===id);if(def)buy(def,isClick);renderModal()})});document.querySelectorAll('.workshop-item').forEach(btn=>{btn.addEventListener('click',()=>{const id=btn.dataset.workshop,item=DECOR_ITEMS.find(d=>d.id===id);if(item)buyDecor(item);renderModal()})})}
  if(title==='Prestige'){document.querySelectorAll('[data-prestige]').forEach(btn=>{btn.addEventListener('click',()=>{const def=PRESTIGE_UPGRADES.find(d=>d.id===btn.dataset.prestige);if(def)buyPrestige(def)})});document.querySelectorAll('[data-echo]').forEach(btn=>{btn.addEventListener('click',()=>{const def=ECHO_UPGRADES.find(d=>d.id===btn.dataset.echo);if(def)buyEcho(def)})});document.querySelectorAll('[data-sigil]').forEach(btn=>{btn.addEventListener('click',()=>{const def=SIGIL_UPGRADES.find(d=>d.id===btn.dataset.sigil);if(def)buySigil(def)})});document.querySelectorAll('[data-loadout-save]').forEach(btn=>{btn.addEventListener('click',()=>saveLoadout(parseInt(btn.dataset.loadoutSave,10)))});document.querySelectorAll('[data-loadout-load]').forEach(btn=>{btn.addEventListener('click',()=>loadLoadout(parseInt(btn.dataset.loadoutLoad,10)))});document.querySelectorAll('[data-loadout-del]').forEach(btn=>{btn.addEventListener('click',()=>deleteLoadout(parseInt(btn.dataset.loadoutDel,10)))});const ascendBtn=document.getElementById('ascendBtnModal');if(ascendBtn)ascendBtn.addEventListener('click',doAscend)}
  if(title==='Challenges'){document.querySelectorAll('[data-challenge]').forEach(btn=>{btn.addEventListener('click',()=>{const ch=CHALLENGES.find(c=>c.id===btn.dataset.challenge);if(ch)startChallenge(ch)})});const ab=document.getElementById('abandonBtn');if(ab)ab.addEventListener('click',abandonChallenge)}
  if(title==='Customize'){document.querySelectorAll('[data-pet]').forEach(btn=>{btn.addEventListener('click',()=>{state.settings.pet=btn.dataset.pet;state.customizeCount+=1;renderPet();save();renderModal();toast('🐾 Pet changed!','ach')})});document.querySelectorAll('[data-sound]').forEach(btn=>{btn.addEventListener('click',()=>{state.settings.soundPack=btn.dataset.sound;state.customizeCount+=1;save();renderModal();toast('🔊 Sound pack: '+SOUND_PACKS[btn.dataset.sound].name);SFX.buy()})});document.querySelectorAll('[data-upgrade-theme]').forEach(btn=>{btn.addEventListener('click',()=>{state.settings.upgradeTheme=btn.dataset.upgradeTheme;state.customizeCount+=1;save();render();toast('🎨 Theme: '+UPGRADE_THEMES[btn.dataset.upgradeTheme].name)})});document.querySelectorAll('[data-bg]').forEach(btn=>{btn.addEventListener('click',()=>{state.settings.bg=btn.dataset.bg;state.customizeCount+=1;applyBg();save();renderModal();toast('🖼️ Background: '+BG_THEMES[btn.dataset.bg].name)})});document.querySelectorAll('[data-sticker-size]').forEach(btn=>{btn.addEventListener('click',()=>{state.settings.stickerSize=btn.dataset.stickerSize;state.customizeCount+=1;applyStickerSize();save();renderModal()})})}
  if(title==='Settings'){const t=document.getElementById('themeSelectModal');if(t)t.addEventListener('change',()=>{state.settings.theme=t.value;applyTheme(t.value);save()});const s=document.getElementById('soundToggleModal');if(s)s.addEventListener('change',()=>{state.settings.sound=s.checked;save()});const m=document.getElementById('musicToggleModal');if(m)m.addEventListener('change',()=>{state.settings.musicEnabled=m.checked;save();if(m.checked&&!state.zenMode)startMusic();else stopMusic()});const mv=document.getElementById('musicVolumeModal');if(mv){mv.addEventListener('input',()=>{state.settings.musicVolume=parseInt(mv.value,10);const lbl=document.getElementById('musicVolumeLabel');if(lbl)lbl.textContent=mv.value+'%';if(musicPlaying&&musicNodes&&audioCtx){try{const vol=(state.settings.musicVolume/100)*0.06;musicNodes.gain.gain.linearRampToValueAtTime(vol,audioCtx.currentTime+0.2)}catch(e){}}save()})}const va=document.getElementById('videoApplyBtnModal');if(va)va.addEventListener('click',()=>{const url=document.getElementById('videoUrlInputModal').value.trim();state.settings.videoUrl=url;if(url)showTVVideo(url);else startTVFacts();save();toast(url?'Video loaded.':'Facts restored.')});const vc=document.getElementById('videoClearBtnModal');if(vc)vc.addEventListener('click',()=>{state.settings.videoUrl='';document.getElementById('videoUrlInputModal').value='';startTVFacts();save()});const ex=document.getElementById('exportBtnModal');if(ex)ex.addEventListener('click',()=>{save();document.getElementById('saveBoxModal').value=localStorage.getItem(SAVE_KEY)||'';toast('Save exported.')});const im=document.getElementById('importBtnModal');if(im)im.addEventListener('click',()=>{const raw=document.getElementById('saveBoxModal').value.trim();if(!raw){toast('Paste a save first.');return}try{JSON.parse(raw);localStorage.setItem(SAVE_KEY,raw);toast('Save imported. Reloading…');setTimeout(()=>location.reload(),600)}catch(e){toast('Invalid save.')}})}
  if(title==='Reset All'){const wb=document.getElementById('wipeBtnModal');if(wb)wb.addEventListener('click',()=>{if(confirm('Wipe ALL progress? This cannot be undone.')){try{localStorage.removeItem(SAVE_KEY);for(const k of OLD_KEYS)localStorage.removeItem(k)}catch(e){}location.reload()}})}
}

function loop(now){
  const dt=Math.min((now-lastTime)/1000,2);
  lastTime=now;
  if(state.paused){if(now-lastRender>50){render();lastRender=now}requestAnimationFrame(loop);return}
  if(state.combo>0){state.combo-=comboDecayRate()*dt;if(state.combo<0)state.combo=0}
  const gain=income()*dt;
  if(gain>0){state.sparks+=gain;state.totalSparks+=gain;state.runSparks+=gain}
  tickPet(dt,now);tickDrops(dt);tickMiniOrbs(dt);trySpawnEvent(now);trySpawnBoss(now);trySpawnChest(now);trySpawnTrader(now);trySpawnShootingStar();checkAutoBuy(now);updateMusicMood();
  if(now-lastRender>50){render();lastRender=now}
  checkAchievements();checkMilestones();checkChallengeProgress();checkQuests();
  if(!goldenEl&&Date.now()>=nextGoldenAt)spawnGolden();
  if(now-lastSave>10000){save();lastSave=now}
  requestAnimationFrame(loop);
}

const KONAMI=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
document.addEventListener('keydown',e=>{
  if(e.target&&['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){
    if(e.target.id==='cheatInput'&&e.key==='Enter'){e.preventDefault();activateCheat(e.target.value);e.target.value=''}
    if(e.target.id==='cheatInput'&&e.key==='Escape')hideCheatModal();
    return;
  }
  state.konamiBuffer.push(e.key);
  if(state.konamiBuffer.length>KONAMI.length)state.konamiBuffer.shift();
  if(state.konamiBuffer.join(',')===KONAMI.join(',')){state.konamiBuffer=[];revealCheatModal();return}
  if(e.code==='Escape'&&!$('modalOverlay').classList.contains('hidden')){closeModal();return}
  if(e.code==='Space'||e.code==='Enter'){if(document.activeElement&&document.activeElement.tagName==='BUTTON')return;e.preventDefault();const r=$('orb').getBoundingClientRect();doClick(r.left+r.width/2,r.top+r.height/2)}
});
$('cheatClose').addEventListener('click',hideCheatModal);
$('clickerCenter').addEventListener('click',e=>{
  if(!decorMode)return;
  if(e.target.closest('.decor-toggle')||e.target.closest('.palette')||e.target.closest('.sticker')||e.target.closest('.orb-main')||e.target.closest('.mini-orb')||e.target.closest('.boss-target')||e.target.closest('.chest'))return;
  const rect=$('clickerCenter').getBoundingClientRect();
  const x=e.clientX-rect.left-11,y=e.clientY-rect.top-11;
  if(x>0&&y>0&&x<rect.width-16&&y<rect.height-16)placeSticker(selectedSticker,x,y);
});
$('dailyBtn').addEventListener('click',claimDaily);
document.addEventListener('visibilitychange',()=>{if(document.hidden){state.totalPlaytime+=(Date.now()-state.sessionStart)/1000;state.sessionStart=Date.now();save()}else state.sessionStart=Date.now()});
window.addEventListener('beforeunload',e=>{save();if(state.activeChallenge){e.preventDefault();e.returnValue='You are in a challenge — leaving will lose your current run. Are you sure?';return e.returnValue}});

function boot(){
  load();
  applyTheme(state.settings.theme);applyBg();applyStickerSize();
  initPet();buildMiniOrbs();renderStickers();initTV();spawnFireflies();
  setInterval(spawnButterfly,15000);
  while(state.quests.length<3)state.quests.push(generateQuest());
  scheduleGolden();
  state.nextChestAt=Date.now()+30000+Math.random()*60000;
  state.lastTraderAt=Date.now()-120000;
  // Auto-start music on first real interaction
  const startMusicOnce=()=>{if(state.settings.musicEnabled&&!state.zenMode&&!musicPlaying)startMusic()};
  ['pointerdown','keydown'].forEach(evt=>document.addEventListener(evt,startMusicOnce,{once:true,capture:true}));
  if(state.totalSparks<10){
    setTimeout(()=>toast('Welcome! Click the ⚡ orb to earn sparks.'),500);
    setTimeout(()=>toast('Feed your pet when it gets hungry.'),7000);
    setTimeout(()=>toast('Watch for treasure chests and the wandering trader!'),14000);
  }
  render();renderQuests();
  requestAnimationFrame(loop);
}
boot();
