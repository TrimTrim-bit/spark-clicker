<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spark Clicker</title>
<meta name="theme-color" content="#7c3aed">
<style>
:root{--bg-1:#241a56;--bg-2:#10233f;--bg-base:#06050c;--panel-bg:rgba(18,15,34,.82);--panel-border:rgba(255,255,255,.08);--item-bg:rgba(255,255,255,.04);--item-border:rgba(255,255,255,.07);--accent:#7c3aed;--accent-light:#c4b5fd;--accent-mid:#a78bfa;--accent-dark:#3b0764;--accent-glow:rgba(139,92,246,.45);--text:#e8e6f5;--text-dim:#8f8ab5;--text-dimmer:#6f6a94;--gold:#fbbf24;--gold-light:#fde68a;--echo:#22d3ee;--echo-light:#a5f3fc;--rose:#f43f5e}
body[data-theme="ocean"]{--bg-1:#0a2540;--bg-2:#051a2e;--bg-base:#01050a;--panel-bg:rgba(10,20,35,.82);--accent:#0ea5e9;--accent-light:#7dd3fc;--accent-mid:#38bdf8;--accent-dark:#075985;--accent-glow:rgba(14,165,233,.5);--gold:#5eead4;--gold-light:#99f6e4}
body[data-theme="sunset"]{--bg-1:#4a1428;--bg-2:#3a1a0a;--bg-base:#0f0507;--panel-bg:rgba(30,15,20,.82);--accent:#f97316;--accent-light:#fdba74;--accent-mid:#fb923c;--accent-dark:#7c2d12;--accent-glow:rgba(249,115,22,.5)}
body[data-theme="forest"]{--bg-1:#143020;--bg-2:#1a3010;--bg-base:#050a05;--panel-bg:rgba(15,30,20,.82);--accent:#10b981;--accent-light:#6ee7b7;--accent-mid:#34d399;--accent-dark:#064e3b;--accent-glow:rgba(16,185,129,.5);--gold:#fbbf24;--gold-light:#fde68a}
body[data-theme="midnight"]{--bg-1:#0a1030;--bg-2:#150a2a;--bg-base:#01010a;--panel-bg:rgba(8,10,24,.88);--accent:#4f46e5;--accent-light:#a5b4fc;--accent-mid:#818cf8;--accent-dark:#1e1b4b;--accent-glow:rgba(99,102,241,.55);--gold:#a5b4fc;--gold-light:#c7d2fe}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{min-height:100vh;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:center;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:radial-gradient(circle at 15% -10%,var(--bg-1) 0%,transparent 55%),radial-gradient(circle at 90% 110%,var(--bg-2) 0%,transparent 50%),var(--bg-base);-webkit-font-smoothing:antialiased;transition:background .4s ease;overflow-x:hidden}
body.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,4px)}40%{transform:translate(5px,-5px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-2px)}}
.hidden{display:none!important}
.game{display:grid;grid-template-columns:240px minmax(0,1fr) 260px;gap:12px;width:min(1400px,100%);height:min(900px,96vh)}
.panel{background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(12px);transition:border-color .3s,box-shadow .3s,background .4s;overflow:hidden}
.left-panel,.right-panel{display:flex;flex-direction:column;padding:12px;gap:10px;overflow-y:auto}
.left-panel::-webkit-scrollbar,.right-panel::-webkit-scrollbar{width:4px}
.left-panel::-webkit-scrollbar-thumb,.right-panel::-webkit-scrollbar-thumb{background:var(--accent-glow);border-radius:4px}
.panel-section{background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.panel-title{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dimmer);margin:0;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.05)}
.garden{position:relative;height:170px;background:linear-gradient(180deg,rgba(139,92,246,.08) 0%,rgba(139,92,246,.02) 50%,rgba(74,222,128,.08) 100%);border-radius:10px;overflow:hidden;border:1px solid rgba(74,222,128,.15)}
.garden::after{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(180deg,rgba(74,222,128,.15),rgba(34,197,94,.25));pointer-events:none;z-index:1}
.pet{position:absolute;width:60px;height:60px;cursor:pointer;user-select:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));-webkit-tap-highlight-color:transparent;background:none;border:none;padding:0;z-index:3;transition:filter .15s}
.pet:hover{filter:drop-shadow(0 0 10px var(--gold))}
.pet.facing-left{transform:scaleX(-1)}
.pet.hungry{animation:hungrySway .8s ease-in-out infinite}
@keyframes hungrySway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.pet.facing-left.hungry{animation:hungrySwayFlip .8s ease-in-out infinite}
@keyframes hungrySwayFlip{0%,100%{transform:scaleX(-1) rotate(-4deg)}50%{transform:scaleX(-1) rotate(4deg)}}
.chicken-svg{width:100%;height:100%;display:block;transition:transform .1s}
.pet.walking .chicken-svg{animation:chickenBob .35s ease-in-out infinite}
@keyframes chickenBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.pet.sleeping{opacity:.65;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)) brightness(.8)}
.pet-bubble{position:absolute;font-size:14px;pointer-events:none;animation:bubbleFloat 2s ease-out forwards;z-index:5}
@keyframes bubbleFloat{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-30px) scale(1)}}
.drops-layer{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.drop{position:absolute;width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:19px;border:none;background:transparent;cursor:pointer;pointer-events:auto;animation:dropSpin 2s linear infinite;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 0 8px rgba(251,191,36,.7));transition:transform .15s}
.drop:hover{filter:drop-shadow(0 0 15px var(--gold));transform:scale(1.2)}
@keyframes dropSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.pet-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);font-weight:600}
.hunger-bar{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.hunger-fill{height:100%;width:100%;background:linear-gradient(90deg,#4ade80,#22c55e);border-radius:3px;transition:width .3s,background .3s}
.hunger-fill.hungry{background:linear-gradient(90deg,#f43f5e,#dc2626)}
.bonus-list{display:flex;flex-direction:column;gap:4px;font-size:11px}
.bonus-row{display:flex;justify-content:space-between;color:var(--text-dim)}
.bonus-row span:last-child{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.bonus-row.positive span:last-child{color:#4ade80}
.bonus-row.negative span:last-child{color:#f43f5e}
.workshop-mini{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.ws-item{padding:6px 4px;font-size:10px;background:var(--item-bg);border:1px solid var(--item-border);border-radius:8px;cursor:pointer;font-family:inherit;color:var(--text);text-align:center;transition:all .15s;-webkit-tap-highlight-color:transparent}
.ws-item:not(:disabled):hover{background:rgba(74,222,128,.15);border-color:rgba(74,222,128,.4)}
.ws-item:disabled{opacity:.4;cursor:not-allowed}
.ws-item.owned{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.4);color:#86efac}
.ws-item .ws-icon{font-size:16px;display:block}
.ws-item .ws-name{font-weight:600;font-size:9px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-item .ws-cost{color:var(--gold);font-weight:700;font-size:9px;margin-top:1px}
.ws-item.owned .ws-cost{color:#86efac}
.center-panel{display:flex;flex-direction:column;align-items:center;padding:14px 14px 12px;gap:6px;position:relative;overflow:hidden}
.score-compact{display:flex;align-items:baseline;gap:5px;font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-1px;line-height:1;position:relative;z-index:1}
.score-compact #sparks{background:linear-gradient(180deg,#fff,var(--accent-mid));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.score-compact .bolt{font-size:.7em;filter:drop-shadow(0 0 10px var(--gold))}
.score-compact .per-sec{font-size:11px;color:var(--text-dim);font-weight:600;margin-left:3px}
.prestige-mini-bar{width:100%;max-width:280px;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;position:relative;z-index:1}
.prestige-mini-bar .prestige-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:2px;transition:width .3s}
.clicker-center{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;padding:0 4px;min-height:200px}
.orb-arena{position:relative;width:100%;height:170px;display:flex;align-items:center;justify-content:center;z-index:1}
.orb-main{width:140px;height:140px;border-radius:50%;border:none;cursor:pointer;font-size:52px;display:grid;place-items:center;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;background:radial-gradient(circle at 35% 28%,var(--accent-light),var(--accent) 42%,var(--accent-dark) 100%);box-shadow:0 0 55px var(--accent-glow),inset 0 -14px 32px rgba(0,0,0,.5),inset 0 14px 26px rgba(255,255,255,.22);transition:box-shadow .25s,background .4s,transform .1s;position:relative;z-index:2}
.orb-main:hover{box-shadow:0 0 75px var(--accent-glow),0 0 120px var(--accent-glow),inset 0 -14px 32px rgba(0,0,0,.5),inset 0 14px 26px rgba(255,255,255,.28)}
.orb-main:active{transform:scale(.96)}
.orb-main:focus-visible{outline:3px solid var(--gold);outline-offset:6px}
.orb-main.pop{animation:pop .22s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.93)}100%{transform:scale(1)}}
.mini-orb{position:absolute;width:40px;height:40px;border-radius:50%;border:2px solid rgba(165,243,252,.4);cursor:pointer;font-size:16px;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,var(--accent-light),var(--accent) 42%,var(--accent-dark) 100%);box-shadow:0 0 18px var(--accent-glow);transition:transform .1s,left .3s ease-out,top .3s ease-out;z-index:3;-webkit-tap-highlight-color:transparent}
.mini-orb:hover{box-shadow:0 0 30px var(--accent-glow),0 0 50px rgba(34,211,238,.4)}
.mini-orb:active{transform:scale(.9)}
.click-info{font-size:11px;font-weight:600;color:var(--accent-mid);position:relative;z-index:1}
.click-info strong{color:var(--text)}
.combo-wrap{width:100%;max-width:280px;display:flex;flex-direction:column;gap:3px;opacity:0;transition:opacity .25s;pointer-events:none;position:relative;z-index:1}
.combo-wrap.active{opacity:1}
.combo-label{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--gold-light)}
.combo-label #comboCount{font-size:13px}
.combo-bonus{font-size:10px;color:var(--text-dim)}
.combo-bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.combo-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:3px;transition:width .1s linear}
.combo-rank{font-size:9px;font-weight:800;letter-spacing:2px;text-align:center;color:var(--gold);height:11px;margin-top:1px}
.combo-rank[data-rank="HOT"]{color:#fb923c}
.combo-rank[data-rank="BLAZING"]{color:#f43f5e}
.combo-rank[data-rank="INFERNO"]{color:#fbbf24;text-shadow:0 0 8px rgba(251,191,36,.9)}
.quick-upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:100%;max-width:440px;position:relative;z-index:1}
.quick-upg{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 3px;background:var(--item-bg);border:1px solid var(--item-border);border-radius:9px;cursor:pointer;font-size:9px;color:var(--text);transition:all .15s;font-family:inherit;text-align:center;-webkit-tap-highlight-color:transparent}
.quick-upg:not(:disabled):hover{background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.55)}
.quick-upg:not(:disabled):active{transform:scale(.97)}
.quick-upg:disabled{opacity:.42;cursor:not-allowed;filter:saturate(.4)}
.quick-upg .qu-icon{font-size:16px;line-height:1}
.quick-upg .qu-name{font-weight:600;line-height:1.1;font-size:8.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.quick-upg .qu-cost{color:var(--gold);font-weight:700;font-size:9px}
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:440px;position:relative;z-index:1}
.action-btn{padding:7px 10px;font:inherit;font-size:11px;font-weight:700;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.4);border-radius:9px;color:var(--accent-light);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.action-btn:hover{background:rgba(139,92,246,.28);border-color:rgba(139,92,246,.7)}
.action-btn.buy-orb{background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.4);color:var(--echo-light)}
.action-btn.buy-orb:hover{background:rgba(34,211,238,.22)}
.action-btn:disabled{opacity:.4;cursor:not-allowed}
.goals-ticker{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:440px;font-size:10px;min-height:14px;position:relative;z-index:1}
.goal-chip{padding:2px 7px;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);border-radius:6px;color:var(--text-dim);font-weight:600;font-size:10px}
.daily-btn{font:inherit;font-size:11px;font-weight:700;padding:6px 14px;color:#1a1200;background:linear-gradient(180deg,var(--gold-light),var(--gold));border:none;border-radius:9px;cursor:pointer;box-shadow:0 4px 16px rgba(251,191,36,.4);animation:dailyPulse 2.4s ease-in-out infinite;position:relative;z-index:1}
@keyframes dailyPulse{0%,100%{box-shadow:0 4px 16px rgba(251,191,36,.35)}50%{box-shadow:0 4px 24px rgba(251,191,36,.7)}}
.tv-panel-side{background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(34,211,238,.08));border:1px solid var(--panel-border);border-radius:12px;padding:10px;position:relative;overflow:hidden;min-height:130px;display:flex;flex-direction:column;gap:6px}
.tv-panel-side .panel-title{color:var(--accent-light);border-bottom:none;padding-bottom:0}
.tv-display{flex:1;font-size:11px;line-height:1.5;color:var(--text);font-weight:500;overflow:hidden}
.tv-display .tv-label{display:block;font-size:8px;font-weight:800;letter-spacing:1.2px;color:var(--accent-light);margin-bottom:4px;text-transform:uppercase}
.tv-display .tv-text{display:block;animation:factFade 10s ease-in-out}
@keyframes factFade{0%{opacity:0;transform:translateY(6px)}10%,85%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-4px)}}
.tv-progress{height:2px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
.tv-progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent-mid),var(--echo));animation:tvProg 10s linear}
@keyframes tvProg{from{width:0}to{width:100%}}
.tv-iframe{width:100%;height:120px;border:0;border-radius:6px}
.quest-list{display:flex;flex-direction:column;gap:5px;font-size:11px}
.quest-row{padding:5px 8px;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.2);border-radius:7px;display:flex;justify-content:space-between;gap:6px;align-items:center;transition:all .2s;font-size:10.5px}
.quest-row.complete{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.4)}
.quest-row .q-label{color:var(--text-dim);font-weight:600;flex:1}
.quest-row .q-progress{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.menu-grid{display:flex;flex-direction:column;gap:5px}
.menu-btn{padding:8px 11px;font:inherit;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:var(--text);cursor:pointer;text-align:left;transition:all .15s;-webkit-tap-highlight-color:transparent;display:flex;justify-content:space-between;align-items:center}
.menu-btn:hover{background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.5)}
.menu-btn .m-arrow{color:var(--text-dimmer);font-size:13px}
.decor-toggle{position:absolute;top:10px;right:10px;z-index:5;padding:5px 9px;font:inherit;font-size:10px;font-weight:700;color:var(--text-dim);background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);border-radius:8px;cursor:pointer;transition:all .15s}
.decor-toggle:hover{color:var(--text);border-color:var(--accent-mid)}
.decor-toggle.active{color:var(--gold-light);border-color:var(--gold);background:rgba(251,191,36,.15)}
.stickers-layer{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.sticker{position:absolute;font-size:22px;line-height:1;pointer-events:none;user-select:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
body.decor-mode .sticker{pointer-events:auto;cursor:pointer;transition:transform .15s}
body.decor-mode .sticker:hover{transform:scale(1.2);filter:drop-shadow(0 0 10px #f43f5e)}
body.decor-mode .clicker-center{cursor:crosshair}
body.decor-mode .clicker-center::after{content:"Click to place • Click sticker to remove";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);padding:4px 10px;font-size:10px;font-weight:700;color:var(--gold-light);background:rgba(0,0,0,.7);border-radius:8px;pointer-events:none;z-index:100}
.modal-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:modalFade .2s ease}
@keyframes modalFade{from{opacity:0}to{opacity:1}}
.modal-overlay.hidden{display:none}
.modal-content{width:min(700px,100%);max-height:85vh;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;animation:modalIn .2s ease-out;box-shadow:0 20px 60px rgba(0,0,0,.7)}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--panel-border);flex-shrink:0}
.modal-header h2{margin:0;font-size:15px;font-weight:700;color:var(--text)}
.modal-close{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--text-dim);cursor:pointer;font-size:13px;transition:all .15s}
.modal-close:hover{background:rgba(255,100,100,.15);color:#ff8a8a;border-color:rgba(255,120,120,.4)}
.modal-body{flex:1;overflow-y:auto;padding:14px 18px}
.modal-body::-webkit-scrollbar{width:8px}
.modal-body::-webkit-scrollbar-thumb{background:var(--accent-glow);border-radius:4px}
.modal-body h2{margin:14px 0 8px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dimmer)}
.modal-body h2:first-child{margin-top:0}
.tab-sub{margin:0 0 10px;font-size:12px;color:var(--text-dim);line-height:1.5}
.buy-qty{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:8px 10px;background:var(--item-bg);border:1px solid var(--item-border);border-radius:10px}
.buy-qty span{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-dimmer);margin-right:auto}
.qty-btn{font:inherit;font-size:12px;font-weight:600;padding:5px 10px;color:var(--accent-light);background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.3);border-radius:7px;cursor:pointer;transition:all .15s}
.qty-btn:hover{background:rgba(139,92,246,.22)}
.qty-btn.active{color:#0d0a1a;background:var(--accent-light);border-color:var(--accent-light)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;font:inherit;text-align:left;color:inherit;background:var(--item-bg);border:1px solid var(--item-border);border-radius:13px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.item:not(:disabled):hover{background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.55)}
.item:not(:disabled):active{transform:scale(.98)}
.item:disabled{opacity:.42;cursor:not-allowed;filter:saturate(.4)}
.item .icon{font-size:24px;line-height:1}
.item .info{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.item .name{font-size:14px;font-weight:600}
.item .effect{font-size:11.5px;color:#9d9ab8}
.item .cost{font-size:13px;font-weight:700;color:var(--gold);margin-top:2px}
.item:disabled .cost{color:var(--text-dimmer)}
.item .owned{font-size:19px;font-weight:800;color:rgba(255,255,255,.2);min-width:34px;text-align:right}

const SUFFIXES = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc'];
function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<0)return '-'+fmt(-n);
  if(n<1000){
    if(n===0)return '0';
    if(n<100)return(Math.round(n*10)/10).toString();
    return Math.floor(n).toString();
  }
  const tier=Math.floor(Math.log10(n)/3);
  if(tier>=SUFFIXES.length)return n.toExponential(2).replace('e+','e');
  const scaled=n/Math.pow(1000,tier);
  const digits=scaled<10?2:scaled<100?1:0;
  return scaled.toFixed(digits)+SUFFIXES[tier];
}
function fmtTime(sec){
  sec=Math.floor(sec);
  const d=Math.floor(sec/86400),h=Math.floor((sec%86400)/3600);
  const m=Math.floor((sec%3600)/60),s=sec%60;
  if(d>0)return d+'d '+h+'h';
  if(h>0)return h+'h '+m+'m';
  if(m>0)return m+'m '+s+'s';
  return s+'s';
}

function pLevel(id){return state.prestigeUpgrades[id]||0}
function eLevel(id){return state.echoUpgrades[id]||0}
function sLevel(id){return state.sigilUpgrades[id]||0}
function pEffect(type){let t=0;for(const u of PRESTIGE_UPGRADES)if(u.effect===type)t+=pLevel(u.id)*u.perLevel;return t}
function eEffect(type){let t=0;for(const u of ECHO_UPGRADES)if(u.effect===type)t+=eLevel(u.id)*u.perLevel;return t}
function sEffect(type){let t=0;for(const u of SIGIL_UPGRADES)if(u.effect===type)t+=sLevel(u.id)*u.perLevel;return t}

function challengeReward(type){
  let total=0;
  for(const ch of CHALLENGES){
    const count=state.challengesCompleted[ch.id]||0;
    if(!count)continue;
    if(ch.reward.type===type)total+=ch.reward.value*count;
  }
  return total*(1+sEffect('challenge'));
}
function challengeDiscount(){return(state.challengesCompleted.no_frills||0)*0.10}
function challengeComboCap(){return(state.challengesCompleted.combo_king||0)*10}

function achCount(){return Object.keys(state.achievements).length}
function achPerAch(){return 0.05+eEffect('achBonus')}
function achMultiplier(){return 1+achCount()*achPerAch()}

function discount(){return Math.min(0.85,pEffect('discount')+challengeDiscount()+sEffect('discount'))}
function costOf(def,count){return Math.ceil(def.baseCost*Math.pow(def.growth,count)*(1-discount()))}
function prestigeCostOf(def){return Math.ceil(def.baseCost*Math.pow(def.growth,pLevel(def.id)))}
function echoCostOf(def){return Math.ceil(def.baseCost*Math.pow(def.growth,eLevel(def.id)))}
function sigilCostOf(def){return Math.ceil(def.baseCost*Math.pow(def.growth,sLevel(def.id)))}
function miniOrbCost(){return Math.ceil(500*Math.pow(1.8,state.miniOrbs.length))}

function challengeMod(){
  if(!state.activeChallenge)return{productionMult:1,clickMult:1,noClickUpgrades:false,noGenerators:false};
  return{productionMult:1,clickMult:1,noClickUpgrades:!!state.activeChallenge.noClickUpgrades,noGenerators:!!state.activeChallenge.noGenerators};
}

function baseClickPower(){let p=1;for(const u of CLICK_UPGRADES)p+=u.power*(state.clickUpgrades[u.id]||0);return p}
function baseIncome(){let r=0;for(const b of BUILDINGS)r+=b.rate*(state.buildings[b.id]||0);return r}

function comboBonus(){return Math.min(state.combo*0.02,1.0)}
function comboCap(){return 50+pEffect('combo')*10+challengeComboCap()}
function comboDecayRate(){return 4/(1+pEffect('combo')*0.15)}
function comboPerClick(){return 1+pEffect('combo')}
function surgeActive(){return Date.now()<state.surgeUntil}
function surgePower(){return 1+pEffect('surge')*0.25}

function petBonus(){
  const h=state.pet.hunger;
  if(h>=75)return 0.20;
  if(h>=50)return 0.10;
  if(h>=25)return 0;
  if(h>=5)return -0.15;
  return -0.30;
}
function decorBonus(){let t=0;for(const item of DECOR_ITEMS)if(state.decor[item.id])t+=item.bonus;return t}

function miniOrbIncome(){
  let total=0;
  for(const orb of state.miniOrbs){
    total+=clickPower()*0.5;
  }
  return total;
}

function totalMultipliers(){
  const ch=challengeMod();
  let incomeMult=1,clickMult=1;
  incomeMult*=achMultiplier();
  clickMult*=achMultiplier();
  incomeMult*=1+pEffect('prod');
  clickMult*=1+pEffect('click');
  incomeMult*=1+challengeReward('prod');
  clickMult*=1+challengeReward('click');
  incomeMult*=1+eEffect('prod');
  clickMult*=1+eEffect('click');
  incomeMult*=ch.productionMult;
  clickMult*=ch.clickMult;
  incomeMult*=1+petBonus();
  incomeMult*=1+decorBonus();
  if(surgeActive()){const sp=2*surgePower();incomeMult*=sp;clickMult*=sp}
  return{incomeMult,clickMult};
}
function clickPower(){const m=totalMultipliers();return baseClickPower()*m.clickMult*(1+comboBonus())}
function income(){
  const m=totalMultipliers();
  const auto=pEffect('autoclick')*baseClickPower()*m.clickMult;
  return baseIncome()*m.incomeMult+auto+miniOrbIncome()*m.clickMult;
}

function prestigeGain(){
  const base=Math.floor(Math.sqrt(Math.max(0,state.runSparks)/2e6));
  return Math.floor(base*(1+pEffect('prestigeMult')+sEffect('prestigeGain')));
}
function prestigeProgress(){
  const gain=prestigeGain();
  const next=Math.pow(gain+1,2)*2e6;
  const prev=Math.pow(gain,2)*2e6;
  return Math.min(1,Math.max(0,state.runSparks-prev)/(next-prev));
}
function ascendGain(){return Math.floor(Math.sqrt(Math.max(0,state.prestigePointsEarned)/10))}
function ascendReady(){return ascendGain()>=1&&state.prestigeCount>=3&&!state.activeChallenge}
function sigilGain(){return Math.max(1,Math.floor(Math.sqrt(Math.max(0,state.prestigePointsEarned)/100)))}
function canUnlockPrestige(def){
  if(!def.requires)return true;
  for(const r of def.requires)if(pLevel(r)>=1)return true;
  return false;
}
function describeRequires(def){
  if(!def.requires)return '';
  return 'Requires: '+def.requires.map(r=>{const u=PRESTIGE_UPGRADES.find(x=>x.id===r);return u?u.name:r}).join(' or ');
}

function unlockAudio(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}}
  if(audioCtx.state==='suspended'){audioCtx.resume().catch(()=>{})}
}

function playTone(freq,dur,type,vol){
  if(!state.settings.sound)return;
  if(!audioCtx||audioCtx.state!=='running')return;
  try{
    const osc=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    osc.type=type||'sine';
    osc.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.08,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    osc.connect(g);g.connect(audioCtx.destination);
    osc.start();osc.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

function tickPet(dt,now){
  const pet=state.pet;
  if(!petEl)return;
  pet.hunger=Math.max(0,pet.hunger-dt*0.12);

  const garden=$('garden');
  const gw=garden.clientWidth;
  const gh=garden.clientHeight;

  if(pet.idleUntil&&now<pet.idleUntil){
    petEl.style.left=pet.x+'px';
    petEl.style.top=pet.y+'px';
    return;
  }

  if(now>pet.nextIdleAt){
    if(Math.random()<0.5){
      pet.idleUntil=now+1500+Math.random()*2000;
      pet.nextIdleAt=now+10000+Math.random()*20000;
      if(pet.hunger<30&&!pet.sleeping){pet.sleeping=true;petEl.classList.add('sleeping')}
      else{pet.sleeping=false;petEl.classList.remove('sleeping')}
    }else{
      pet.nextIdleAt=now+8000+Math.random()*15000;
    }
  }

  const speedBase=pet.hunger<25?0.3:pet.hunger<50?0.6:1.0;
  pet.x+=pet.dir*speedBase*dt*60;

  if(pet.x<4){pet.x=4;pet.dir=1}
  if(pet.x>gw-68){pet.x=gw-68;pet.dir=-1}
  pet.y=gh-70+Math.sin(now/400)*2;

  petEl.style.left=pet.x+'px';
  petEl.style.top=pet.y+'px';
  petEl.classList.toggle('facing-left',pet.dir<0);
  petEl.classList.toggle('hungry',pet.hunger<25&&!pet.sleeping);
  petEl.classList.toggle('walking',!pet.sleeping&&!(pet.idleUntil&&now<pet.idleUntil));

  if(now>pet.nextDropAt&&pet.hunger>=50){
    spawnDrop(pet.x+20,pet.y+10);
    pet.nextDropAt=now+45000+Math.random()*45000;
    showPetBubble('🎁');
  }

  if(now>pet.nextSpeechAt){
    if(pet.hunger<25)showPetBubble('🍽️');
    else if(Math.random()<0.4)showPetBubble(['❤️','✨','😊'][Math.floor(Math.random()*3)]);
    pet.nextSpeechAt=now+25000+Math.random()*25000;
  }
}

/* DROPS */
function pickDropType(){
  const total=DROP_TYPES.reduce((s,d)=>s+d.weight,0);
  let r=Math.random()*total;
  for(const d of DROP_TYPES){r-=d.weight;if(r<=0)return d}
  return DROP_TYPES[0];
}
function spawnDrop(x,y){
  const type=pickDropType();
  const dropEl=document.createElement('button');
  dropEl.className='drop';
  dropEl.type='button';
  dropEl.textContent=type.icon;
  dropEl.style.left=x+'px';
  dropEl.style.top=y+'px';
  const drop={el:dropEl,x,y,vy:40+Math.random()*30,type,caught:false};
  dropEl.addEventListener('click',()=>collectDrop(drop));
  $('dropsLayer').appendChild(dropEl);
  activeDrops.push(drop);
}
function collectDrop(drop){
  if(drop.caught)return;
  drop.caught=true;
  const gain=Math.floor(drop.type.reward(state));
  state.sparks+=gain;
  state.totalSparks+=gain;
  state.runSparks+=gain;
  state.dropsCaught+=1;
  spawnFloat(parseFloat(drop.el.style.left)+20,parseFloat(drop.el.style.top)+20,'+'+fmt(gain),true);
  SFX.drop();
  drop.el.remove();
  const idx=activeDrops.indexOf(drop);
  if(idx>=0)activeDrops.splice(idx,1);
  save();
}
function tickDrops(dt){
  const garden=$('garden');
  const gh=garden.clientHeight;
  for(let i=activeDrops.length-1;i>=0;i--){
    const d=activeDrops[i];
    if(d.caught)continue;
    d.y+=d.vy*dt;
    d.vy+=60*dt;
    if(d.y>gh-30){
      d.el.remove();
      activeDrops.splice(i,1);
    }else{
      d.el.style.top=d.y+'px';
    }
  }
}

  });

  toast('🌀 Mini orb purchased! It clicks for you.');

function tickMiniOrbs(dt){
  const arena=$('orbArena');
  if(!arena)return;
  const cx=arena.clientWidth/2;
  const cy=arena.clientHeight/2;
  for(const orb of state.miniOrbs){
    orb.angle+=orb.orbitSpeed*dt;
    orb.x=cx+Math.cos(orb.angle)*orb.orbitRadius-20;
    orb.y=cy+Math.sin(orb.angle)*orb.orbitRadius-20;

      orb.el.style.top=orb.y+'px';
    }

/* QUESTS */
const QUEST_TYPES=[
  {id:'click',gen:()=>({goal:20+Math.floor(Math.random()*30),scale:2}),test:(s,q)=>s.clicks-q.startValue>=q.goal},
  {id:'buy',gen:()=>({goal:3+Math.floor(Math.random()*5),scale:3}),test:(s,q)=>countBuyable()-q.startValue>=q.goal},
  {id:'drops',gen:()=>({goal:2+Math.floor(Math.random()*3),scale:5}),test:(s,q)=>s.dropsCaught-q.startValue>=q.goal},
  {id:'feed',gen:()=>({goal:2+Math.floor(Math.random()*3),scale:4}),test:(s,q)=>s.pet.fedCount-q.startValue>=q.goal},
  {id:'events',gen:()=>({goal:1+Math.floor(Math.random()*2),scale:8}),test:(s,q)=>s.eventsCaught-q.startValue>=q.goal}
];
function countBuyable(){
  let c=0;for(const k in state.clickUpgrades)c+=state.clickUpgrades[k];for(const k in state.buildings)c+=state.buildings[k];return c;
}
function generateQuest(){
  const type=QUEST_TYPES[Math.floor(Math.random()*QUEST_TYPES.length)];
  const g=type.gen();
  return{
    id:type.id,goal:g.goal,scale:g.scale,
    startValue:type.id==='click'?state.clicks:type.id==='buy'?countBuyable():type.id==='drops'?state.dropsCaught:type.id==='feed'?state.pet.fedCount:state.eventsCaught,
    complete:false
  };
}
function checkQuests(){
  let changed=false;
  for(const q of state.quests){
    if(q.complete)continue;
    const type=QUEST_TYPES.find(t=>t.id===q.id);
    if(!type)continue;
    if(type.test(state,q)){
      q.complete=true;
      const reward=Math.max(500,income()*q.scale);
      state.sparks+=reward;
      state.totalSparks+=reward;
      state.runSparks+=reward;
      state.questsCompleted+=1;
      setTimeout(()=>{toast('📋 Quest complete: +'+fmt(reward),'ach');SFX.ach()},pendingAchToasts*400);
      changed=true;
    }
  }
  if(changed){
    setTimeout(()=>{
      state.quests=state.quests.filter(q=>!q.complete);
      while(state.quests.length<3)state.quests.push(generateQuest());
      renderQuests();
    },1500);
  }
}
function renderQuests(){
  const list=$('questList');
  list.innerHTML='';
  for(const q of state.quests){
    let current=0,goal=q.goal;
    if(q.id==='click')current=state.clicks-q.startValue;
    else if(q.id==='buy')current=countBuyable()-q.startValue;
    else if(q.id==='drops')current=state.dropsCaught-q.startValue;
    else if(q.id==='feed')current=state.pet.fedCount-q.startValue;
    else if(q.id==='events')current=state.eventsCaught-q.startValue;
    const labelMap={click:'Click',buy:'Buy',drops:'Catch drops',feed:'Feed pet',events:'Catch events'};
    const row=document.createElement('div');
    row.className='quest-row'+(q.complete?' complete':'');
    row.innerHTML='<span class="q-label">'+labelMap[q.id]+'</span><span class="q-progress">'+Math.min(current,goal)+'/'+goal+'</span>';
    list.appendChild(row);
  }
}

  return m&&m[1]?m[1]:null;
}

function load(){
  let raw=null;
  try{raw=localStorage.getItem(SAVE_KEY)}catch(e){return}
  if(!raw){
    for(const key of OLD_KEYS){try{raw=localStorage.getItem(key)}catch(e){}if(raw)break}
  }
  if(!raw)return;
  let d;
  try{d=JSON.parse(raw)}catch(e){return}
  if(!d||typeof d!=='object')return;
  const clean=(v)=>{const n=Number(v);return Number.isFinite(n)&&n>=0?n:0};
  const cc=d.challengesCompleted||{};
  const migrated={};
  for(const id in cc)migrated[id]=Number(cc[id])||0;
  state.challengesCompleted=migrated;
  state.sparks=clean(d.sparks);
  state.totalSparks=clean(d.totalSparks);
  state.runSparks=clean(d.runSparks);
  state.clicks=clean(d.clicks);
  state.clickUpgrades=d.clickUpgrades||{};
  state.buildings=d.buildings||{};
  state.clickUpgradesBought=clean(d.clickUpgradesBought);
  state.achievements=d.achievements||{};
  state.prestigePoints=clean(d.prestigePoints);
  state.prestigePointsEarned=clean(d.prestigePointsEarned)||state.prestigePoints;
  state.prestigeCount=clean(d.prestigeCount);
  state.prestigeUpgrades=d.prestigeUpgrades||{};
  state.echoes=clean(d.echoes);
  state.echoesEarned=clean(d.echoesEarned)||state.echoes;
  state.ascendCount=clean(d.ascendCount);
  state.echoUpgrades=d.echoUpgrades||{};
  state.sigils=clean(d.sigils);
  state.sigilsEarned=clean(d.sigilsEarned)||state.sigils;
  state.sigilUpgrades=d.sigilUpgrades||{};
  state.activeChallenge=d.activeChallenge||null;
  state.savedNormalRun=d.savedNormalRun||null;
  state.goldenSparks=clean(d.goldenSparks);
  state.maxCombo=clean(d.maxCombo);
  state.milestonesSeen=d.milestonesSeen||{};
  state.lastDailyClaim=clean(d.lastDailyClaim);
  state.dailyClaims=clean(d.dailyClaims);
  state.totalPlaytime=clean(d.totalPlaytime);
  state.settings=Object.assign({theme:'purple',sound:true,videoUrl:''},d.settings||{});
  const pet=d.pet||{};
  state.pet.hunger=typeof pet.hunger==='number'?pet.hunger:100;
  state.pet.fedCount=clean(pet.fedCount);
  state.pet.feedCooldownUntil=clean(pet.feedCooldownUntil);
  state.dropsCaught=clean(d.dropsCaught);
  state.eventsCaught=clean(d.eventsCaught);
  state.questsCompleted=clean(d.questsCompleted);
  state.stickers=Array.isArray(d.stickers)?d.stickers.filter(s=>s&&typeof s.emoji==='string'&&typeof s.x==='number'&&typeof s.y==='number'):[];
  state.decor=d.decor||{};
  state.miniOrbs=Array.isArray(d.miniOrbs)?d.miniOrbs.map(o=>({
    angle:Number(o.angle)||0,
    orbitSpeed:Number(o.orbitSpeed)||0.8,
    orbitRadius:Number(o.orbitRadius)||65,
    x:0,y:0
  })).slice(0,6):[];
  if(state.activeChallenge&&!state.savedNormalRun)state.activeChallenge=null;
  const lastSaved=Number(d.lastSaved)||Date.now();
  const elapsed=Math.max(0,(Date.now()-lastSaved)/1000);
  if(elapsed>60){
    const capped=Math.min(elapsed,8*3600);
    const gain=income()*capped*0.5;
    if(gain>0){
      if(state.activeChallenge&&state.savedNormalRun){
        state.savedNormalRun.sparks+=gain;
        state.savedNormalRun.runSparks+=gain;
      }else{
        state.sparks+=gain;
        state.runSparks+=gain;
      }
      state.totalSparks+=gain;
      setTimeout(()=>toast('Welcome back! +'+fmt(gain)+' sparks earned while away.'),800);
    }
  }
}

function totalCostFor(def,count,qty){let total=0;for(let i=0;i<qty;i++)total+=costOf(def,count+i);return total}
function maxAffordable(def,count){let total=0,qty=0;while(qty<10000){const c=costOf(def,count+qty);if(total+c>state.sparks)break;total+=c;qty++}return qty}

function buy(def,isClick){
  state.lastActivity=Date.now();
  lastActiveClick=Date.now();
  const mod=challengeMod();
  if(isClick&&mod.noClickUpgrades){toast('Click upgrades are disabled in this challenge.');return}
  if(!isClick&&mod.noGenerators){toast('Generators are disabled in this challenge.');return}
  const store=isClick?state.clickUpgrades:state.buildings;
  const count=store[def.id]||0;
  let qty;
  if(buyQty==='max'){qty=maxAffordable(def,count);if(qty===0)return}
  else qty=buyQty;
  const cost=totalCostFor(def,count,qty);
  if(state.sparks<cost)return;
  state.sparks-=cost;
  store[def.id]=count+qty;
  if(isClick)state.clickUpgradesBought+=qty;
  SFX.buy();
  save();
}
function buyDecor(item){
  if(state.decor[item.id])return;
  if(state.sparks<item.cost)return;
  state.sparks-=item.cost;
  state.decor[item.id]=true;
  SFX.buy();
  toast('🪴 Added: '+item.name);
  save();
}
function buyPrestige(def){

/* CHALLENGES */
function startChallenge(ch){
  if(state.activeChallenge)return;
  const currentCount=state.challengesCompleted[ch.id]||0;
  const goal=ch.goal*Math.pow(2,currentCount);
  const goalText=ch.goalType==='maxCombo'?Math.ceil(goal)+'x':fmt(goal);
  if(!confirm('Start "'+ch.name+'"?\n\n'+ch.desc.replace('{goal}',goalText)+'\n\nReward: '+ch.reward.label+'\n\nYour normal run is saved and will be restored when you finish or abandon.'))return;
  state.savedNormalRun={
    sparks:state.sparks,clickUpgrades:Object.assign({},state.clickUpgrades),buildings:Object.assign({},state.buildings),
    clickUpgradesBought:state.clickUpgradesBought,runSparks:state.runSparks,maxCombo:state.maxCombo,
    miniOrbs:state.miniOrbs.map(o=>({...o}))
  };
  state.sparks=0;state.clickUpgrades={};state.buildings={};
  state.clickUpgradesBought=0;state.runSparks=0;state.combo=0;state.maxCombo=0;
  state.miniOrbs=[];
  buildMiniOrbs();
  state.activeChallenge={
    id:ch.id,name:ch.name,icon:ch.icon,tier:ch.tier,
    desc:ch.desc.replace('{goal}',goalText),
    goal:goal,goalType:ch.goalType,maxCombo:0,
    noClickUpgrades:!!ch.noClickUpgrades,noGenerators:!!ch.noGenerators,
    reward:ch.reward
  };
  state.lastActivity=Date.now();
  toast('⚔️ Challenge started: '+ch.name);
  save();
  closeModal();
}
function abandonChallenge(){
  if(!state.activeChallenge)return;
  if(!confirm('Abandon this challenge? Progress will be lost (no reward).'))return;
  if(!confirm('Are you sure? This cannot be undone.'))return;
  restoreNormalRun();
  toast('Challenge abandoned.');
  save();
  closeModal();
}
function restoreNormalRun(){
  if(state.savedNormalRun){
    state.sparks=state.savedNormalRun.sparks;
    state.clickUpgrades=state.savedNormalRun.clickUpgrades;
    state.buildings=state.savedNormalRun.buildings;
    state.clickUpgradesBought=state.savedNormalRun.clickUpgradesBought;
    state.runSparks=state.savedNormalRun.runSparks;
    state.maxCombo=state.savedNormalRun.maxCombo;
    state.miniOrbs=(state.savedNormalRun.miniOrbs||[]).map(o=>({...o,x:0,y:0}));
    state.savedNormalRun=null;
    buildMiniOrbs();
  }
  state.activeChallenge=null;
  state.combo=0;
}
function completeChallenge(){
  const active=state.activeChallenge;
  if(!active)return;
  state.challengesCompleted[active.id]=(state.challengesCompleted[active.id]||0)+1;
  restoreNormalRun();
  SFX.ach();
  toast('🏆 Challenge complete: '+active.name+' — '+active.reward.label);
  save();
}
function checkChallengeProgress(){
  const active=state.activeChallenge;
  if(!active)return;
  let current=0;
  if(active.goalType==='runSparks')current=state.runSparks;
  else if(active.goalType==='maxCombo')current=active.maxCombo||0;
  if(current>=active.goal)completeChallenge();
}

function spawnGolden(){
  if(goldenEl)return;
  const panel=document.querySelector('.center-panel');
  const layer=$('goldenLayer');
  if(!panel||!layer)return;
  const rect=panel.getBoundingClientRect();
  const x=rect.left+30+Math.random()*Math.max(0,rect.width-120);
  const y=rect.top+30+Math.random()*Math.max(0,rect.height-120);
  const btn=document.createElement('button');
  btn.className='golden-spark';
  btn.textContent='⚡';
  btn.style.left=x+'px';btn.style.top=y+'px';
  btn.addEventListener('click',collectGolden);
  layer.appendChild(btn);
  goldenEl=btn;
  setTimeout(()=>{if(goldenEl===btn){btn.remove();goldenEl=null;scheduleGolden()}},10000);
}
function collectGolden(){
  if(!goldenEl)return;
  const el=goldenEl;goldenEl=null;el.remove();
  const base=Math.max(income()*30,clickPower()*100,50);
  const bonus=Math.floor(base*(2+Math.random()*3));
  state.sparks+=bonus;state.totalSparks+=bonus;state.runSparks+=bonus;
  state.goldenSparks+=1;
  const r=el.getBoundingClientRect();
  spawnFloat(r.left+30,r.top+30,'+'+fmt(bonus),true);
  SFX.golden();
  toast('🌟 Golden spark! +'+fmt(bonus));
  save();
  scheduleGolden();
}
function scheduleGolden(){nextGoldenAt=Date.now()+60000+Math.random()*120000}

function renderQuickUpgrades(){
  const el=$('quickUpgrades');
  const combined=[];
  for(const def of CLICK_UPGRADES){
    combined.push({def,isClick:true,count:state.clickUpgrades[def.id]||0});
  }
  for(const def of BUILDINGS){
    combined.push({def,isClick:false,count:state.buildings[def.id]||0});
  }
  combined.sort((a,b)=>{
    const ca=costOf(a.def,a.count),cb=costOf(b.def,b.count);
    return ca-cb;
  });
  const show=combined.slice(0,6);
  el.innerHTML='';
  for(const item of show){
    const cost=costOf(item.def,item.count);
    const btn=document.createElement('button');
    btn.className='quick-upg';
    btn.type='button';
    btn.innerHTML='<span class="qu-icon">'+item.def.icon+'</span><span class="qu-name">'+item.def.name+'</span><span class="qu-cost">'+fmt(cost)+'</span><span class="qu-count">×'+item.count+'</span>';
    btn.disabled=state.sparks<cost;
    btn.addEventListener('click',()=>buy(item.def,item.isClick));
    el.appendChild(btn);
  }
}

function renderWorkshopMini(){
  for(const id in wsEls){
    const btn=wsEls[id];
    const item=DECOR_ITEMS.find(d=>d.id===id);

function attachModalListeners(title){
  if(title==='Shop'){
    document.querySelectorAll('[data-qty]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const q=btn.dataset.qty;
        buyQty=q==='max'?'max':parseInt(q,10);
        renderModal();
      });
    });
    document.querySelectorAll('.shop-item').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const id=btn.dataset.shop;
        const isClick=btn.dataset.click==='1';
        const def=(isClick?CLICK_UPGRADES:BUILDINGS).find(d=>d.id===id);
        if(def)buy(def,isClick);
        renderModal();
      });
    });
    document.querySelectorAll('.workshop-item').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const id=btn.dataset.workshop;
        const item=DECOR_ITEMS.find(d=>d.id===id);
        if(item)buyDecor(item);
        renderModal();
      });
    });
  }
  if(title==='Prestige'){
    document.querySelectorAll('[data-prestige]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const def=PRESTIGE_UPGRADES.find(d=>d.id===btn.dataset.prestige);
        if(def)buyPrestige(def);
      });
    });
    document.querySelectorAll('[data-echo]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const def=ECHO_UPGRADES.find(d=>d.id===btn.dataset.echo);
        if(def)buyEcho(def);
      });
    });
    document.querySelectorAll('[data-sigil]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const def=SIGIL_UPGRADES.find(d=>d.id===btn.dataset.sigil);
        if(def)buySigil(def);
      });
    });
    const ascendBtn=document.getElementById('ascendBtnModal');
    if(ascendBtn)ascendBtn.addEventListener('click',doAscend);
  }
  if(title==='Challenges'){
    document.querySelectorAll('[data-challenge]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const ch=CHALLENGES.find(c=>c.id===btn.dataset.challenge);
        if(ch)startChallenge(ch);
      });
    });
    const abandonBtn=document.getElementById('abandonBtn');
    if(abandonBtn)abandonBtn.addEventListener('click',abandonChallenge);
  }
  if(title==='Settings'){
    const themeSelect=document.getElementById('themeSelectModal');
    if(themeSelect)themeSelect.addEventListener('change',()=>{
      state.settings.theme=themeSelect.value;
      applyTheme(state.settings.theme);
      save();
    });
    const soundToggle=document.getElementById('soundToggleModal');
    if(soundToggle)soundToggle.addEventListener('change',()=>{
      state.settings.sound=soundToggle.checked;
      save();
    });
    const videoApply=document.getElementById('videoApplyBtnModal');
    if(videoApply)videoApply.addEventListener('click',()=>{
      const url=document.getElementById('videoUrlInputModal').value.trim();
      state.settings.videoUrl=url;
      if(url)showTVVideo(url);
      else startTVFacts();
      save();
      toast(url?'Video loaded.':'Facts restored.');
    });
    const videoClear=document.getElementById('videoClearBtnModal');
    if(videoClear)videoClear.addEventListener('click',()=>{
      state.settings.videoUrl='';
      document.getElementById('videoUrlInputModal').value='';
      startTVFacts();
      save();
    });
    const exportBtn=document.getElementById('exportBtnModal');
    if(exportBtn)exportBtn.addEventListener('click',()=>{
      save();
      document.getElementById('saveBoxModal').value=localStorage.getItem(SAVE_KEY)||'';
      toast('Save exported.');
    });
    const importBtn=document.getElementById('importBtnModal');
    if(importBtn)importBtn.addEventListener('click',()=>{
      const raw=document.getElementById('saveBoxModal').value.trim();
      if(!raw){toast('Paste a save first.');return}
      try{
        JSON.parse(raw);
        localStorage.setItem(SAVE_KEY,raw);
        toast('Save imported. Reloading…');
        setTimeout(()=>location.reload(),600);
      }catch(e){toast('Invalid save.')}
    });
  }
  if(title==='Reset All'){
    const wipeBtn=document.getElementById('wipeBtnModal');
    if(wipeBtn)wipeBtn.addEventListener('click',()=>{
      if(confirm('Wipe ALL progress? This cannot be undone.')){
        try{localStorage.removeItem(SAVE_KEY);for(const k of OLD_KEYS)localStorage.removeItem(k)}catch(e){}
        location.reload();
      }
    });
  }
}

/* LOOP */
function loop(now){
  const dt=Math.min((now-lastTime)/1000,2);
  lastTime=now;

  if(state.combo>0){
    state.combo-=comboDecayRate()*dt;
    if(state.combo<0)state.combo=0;
  }

  const gain=income()*dt;
  if(gain>0){
    state.sparks+=gain;
    state.totalSparks+=gain;
    state.runSparks+=gain;
  }

  tickPet(dt,now);
  tickDrops(dt);
  tickMiniOrbs(dt);
  trySpawnEvent(now);
  trySpawnShootingStar();

  if(now-lastRender>50){
    render();
    lastRender=now;
  }

  checkAchievements();
  checkMilestones();
  checkChallengeProgress();
  checkQuests();

  if(!goldenEl&&Date.now()>=nextGoldenAt)spawnGolden();

  if(now-lastSave>10000){save();lastSave=now}

  requestAnimationFrame(loop);
}

/* WIRING */
$('orb').addEventListener('pointerdown',e=>{doClick(e.clientX,e.clientY)});

$('buyMiniOrbBtn').addEventListener('click',buyMiniOrb);
$('openShopBtn').addEventListener('click',()=>openModal('Shop'));
$('modalClose').addEventListener('click',closeModal);
$('modalOverlay').addEventListener('click',e=>{if(e.target===$('modalOverlay'))closeModal()});

document.querySelectorAll('.menu-btn').forEach(btn=>{
  btn.addEventListener('click',()=>openModal(btn.dataset.menu==='reset'?'Reset All':btn.dataset.menu.charAt(0).toUpperCase()+btn.dataset.menu.slice(1)));
});

$('decorToggle').addEventListener('click',e=>{e.stopPropagation();toggleDecorMode()});

$('clickerCenter').addEventListener('click',e=>{
  if(!decorMode)return;
  if(e.target.closest('.decor-toggle'))return;
  if(e.target.closest('.palette'))return;
  if(e.target.closest('.sticker'))return;
  if(e.target.closest('.orb-main'))return;
  if(e.target.closest('.mini-orb'))return;
  const rect=$('clickerCenter').getBoundingClientRect();
  const x=e.clientX-rect.left-11;
  const y=e.clientY-rect.top-11;
  if(x>0&&y>0&&x<rect.width-16&&y<rect.height-16){
    placeSticker(selectedSticker,x,y);
  }
});

$('dailyBtn').addEventListener('click',claimDaily);

document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.target&&['TEXTAREA','INPUT','SELECT'].includes(e.target.tagName))return;
  if(e.code==='Escape'&&!$('modalOverlay').classList.contains('hidden')){closeModal();return}
  if(e.code==='Space'||e.code==='Enter'){
    if(document.activeElement&&document.activeElement.tagName==='BUTTON')return;
    e.preventDefault();
    const r=$('orb').getBoundingClientRect();
    doClick(r.left+r.width/2,r.top+r.height/2);
  }
});

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    state.totalPlaytime+=(Date.now()-state.sessionStart)/1000;
    state.sessionStart=Date.now();
    save();
  }else{state.sessionStart=Date.now()}
});
window.addEventListener('beforeunload',e=>{
  save();
  if(state.activeChallenge){
    e.preventDefault();
    e.returnValue='You are in a challenge — leaving will lose your current run. Are you sure?';
    return e.returnValue;
  }
});

/* BOOT */
function boot(){
  load();
  applyTheme(state.settings.theme);
  initPet();
  buildWorkshopMini();
  buildMiniOrbs();
  renderStickers();
  initTV();
  spawnFireflies();
  setInterval(spawnButterfly,15000);
  while(state.quests.length<3)state.quests.push(generateQuest());
  scheduleGolden();
  if(state.totalSparks<10){
    setTimeout(()=>toast('Welcome! Click the ⚡ orb to earn sparks.'),500);
    setTimeout(()=>toast('Feed your 🐔 when it gets hungry — happy chickens drop items.'),7000);
    setTimeout(()=>toast('Buy a Mini Orb for automatic clicking.'),15000);
  }
  render();
  renderQuests();
  requestAnimationFrame(loop);
}

boot();
})();
</script>
